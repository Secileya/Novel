name: Retro Zheguang Appearance V3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retro-v3:
    if: ${{ !contains(github.event.head_commit.message, '[zheguang-retro]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse validated retro script and clean markdown whitespace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/retro-zheguang-appearance.yml').read_text(encoding='utf-8')
          marker = "python - <<'PY'\n"
          code = wf.split(marker, 1)[1].split("\n          PY", 1)[0]
          code = textwrap.dedent(code)
          exec(compile(code, 'retro-zheguang-extracted.py', 'exec'))

          root = Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')
          for rel in [
              '02_角色設定/13_折光外觀與白髮選擇補充.md',
              '08_劇情規劃/188_折光外觀與家庭白髮巧思RETRO修復_v1.0.md',
          ]:
              p = root / rel
              lines = p.read_text(encoding='utf-8').splitlines()
              p.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY

          git config user.name "Secileya"
          git config user.email "xw4761645@gmail.com"
          git add "小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）"
          git diff --cached --check
          git commit -m "retro(zheguang): 回改白髮金瞳與家庭巧思 [zheguang-retro]"
          git push origin main
