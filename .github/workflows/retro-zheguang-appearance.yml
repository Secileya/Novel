name: Retro Zheguang Appearance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retro:
    if: ${{ !contains(github.event.head_commit.message, '[zheguang-retro]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply retro appearance patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')

          def rw(rel, reps):
              p = root / rel
              s = p.read_text(encoding='utf-8')
              for old, new in reps:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          rw('01_章節/049_第四十九章_五秒有點多.md', [
              ('左眼沒有繃帶。\n\n黑髮改成淺栗色長髮，眼睛調成灰綠色，五官在系統允許範圍內重新拉開辨識差異。精靈種族本身的耳形則自然保留。\n\n不是為了變得更漂亮。\n\n只是讓兩張臉不需要靠「別人沒看清」才能區分。',
               '左眼沒有繃帶。\n\n黑髮改成白色長髮，眼睛換成璀璨金色。五官沒有換成另一張臉，仍然是她原本的樣子；白髮、金瞳與精靈耳把同一套五官襯得更清透，也多了一點近乎神性的感覺。那只是外觀與氣質上的印象，不代表任何「神」種族、位格或生命層級。精靈種族本身的耳形則自然保留。\n\n白髮是她自己挑的。\n\n家裡白頭髮的人很多。平常看得久了，她一直覺得很好看。現在既然是在替另一個身份選外觀，就順手想試一次。\n\n不是為了模仿哪一個人。\n\n只是想試試看。\n\n身份本身的種族、髮色、瞳色、耳形與氣息已經足夠把兩套對外資料分開，沒有必要再把她的五官改成另一張臉。')
          ])

          rw('01_章節/050_第五十章_這裡真的掉過一顆星.md', [
              ('沒有把人拆散再重組的劇烈感覺，只是系統對外承認的那層身份在極短時間裡換了一套接口。黑髮先褪成淺栗色，長度落到背後；狼耳消失，取而代之的是精靈種族向後延伸的耳形。左眼上的斜向繃帶不見了，兩隻眼睛都變成灰綠色，原本容易和Franiya直接重疊的五官辨識點也被系統重新調開。',
               '沒有把人拆散再重組的劇烈感覺，只是系統對外承認的那層身份在極短時間裡換了一套接口。黑髮先褪成白色，長度落到背後；狼耳消失，取而代之的是精靈種族向後延伸的耳形。左眼上的斜向繃帶不見了，兩隻眼睛都變成璀璨金色。五官沒有被系統換成另一張臉，仍然是Franiya原本的樣子；只是白髮、金瞳與精靈耳把同一套五官托出一點近乎神性的清透感。那只是看起來的氣質，不是任何神性種族或生命層級判定。'),
              ('淺栗色長髮', '白色長髮'),
              ('灰綠色眼睛', '璀璨金色眼睛')
          ])

          rw('01_章節/059_第五十九章_名字可以晚一點.md', [
              ('身份切換成立的瞬間，狼耳消失，黑色長髮被淺栗色長髮取代，左眼斜向繃帶也不見了。灰綠色眼睛睜開時，系統裡那個屬於Franiya主身份的外貌、職業與氣息已經被另一套完整資料接管。',
               '身份切換成立的瞬間，狼耳消失，黑色長髮被白色長髮取代，左眼斜向繃帶也不見了。璀璨金色眼睛睜開時，五官仍然是她原本的樣子，只是白髮、金瞳與精靈耳把同一張臉襯出一點近乎神性的疏離感；系統裡屬於Franiya主身份的職業、種族與氣息則已經被另一套完整資料接管。'),
              ('淺栗色長髮', '白色長髮'),
              ('灰綠色眼睛', '璀璨金色眼睛'),
              ('灰綠瞳', '璀璨金瞳')
          ])

          rw('05_原著參考/24_SOURCE_NODE_千幻之心第二身份與Franiya法師線回修.md', [
              ('- 外貌：淺栗色長髮、灰綠瞳、精靈耳；不保留主身份小狼耳、左眼斜向繃帶、黑髮與深色豎瞳組合；五官於系統允許範圍內重新調整。',
               '- 外貌：白色長髮、璀璨金瞳、精靈耳；不保留主身份小狼耳、左眼斜向繃帶、黑髮與深色豎瞳組合。五官與主身份保持同一套，不另換一張臉；白髮、金瞳與精靈耳使整體呈現一點近乎神性的氣質，但這只是一種外觀／氣質描述，不代表任何「神」種族、位格或生命層級。白髮是Franiya自行選擇的巧思：因家人中有不少白髮，她長期看習慣也覺得好看，所以建立【折光】時帶著「想試試看」的心思選了白髮；不是模仿某一位家人。')
          ])

          rw('04_連續性與索引/01_當前狀態快照.md', [
              ('- 淺栗長髮、灰綠瞳、精靈耳；無主身份狼耳、黑髮、左眼斜向繃帶。',
               '- 白色長髮、璀璨金瞳、精靈耳；五官與主身份相同，無主身份狼耳、黑髮、左眼斜向繃帶。白髮源於Franiya因家人中不少人都是白髮、自己看習慣也覺得好看，所以建立第二身份時想試試看的私人巧思。整體帶一點近乎神性的氣質，但僅為外觀描述，不代表任何神祇種族／位格／生命層級。')
          ])

          rw('00_專案交接.md', [
              ('- 【折光】：Lv10精靈法師／50精神／淺栗長髮／灰綠瞳／精靈耳／身份氣息獨立。',
               '- 【折光】：Lv10精靈法師／50精神／白色長髮／璀璨金瞳／精靈耳／五官與主身份相同／身份氣息獨立；白髮是因家人中不少人都是白髮、她覺得好看而想試試看的私人巧思。整體可呈現一點近乎神性的氣質，但僅為外觀描述，不代表任何神祇種族、位格或生命層級。')
          ])

          p = root / '04_連續性與索引/04L_角色知識矩陣_第59章增量.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace('### 可知道\n- 月神神殿候補神使洛曾在日光森林與Franiya爆發高階戰鬥。',
                        '### 可知道\n- 【折光】外觀為白色長髮、璀璨金瞳與精靈耳；五官本身與Franiya主身份相同。看過兩套高品質影像的人可以合理注意到臉部結構高度相似，但這只構成外貌線索，不能直接證明兩個ID／身份屬於同一人。\n- 月神神殿候補神使洛曾在日光森林與Franiya爆發高階戰鬥。')
          s = s.replace('### 不可知道\n- Franiya與【折光】是同一人。',
                        '### 不可知道\n- 僅憑相同五官就確認Franiya與【折光】是同一人；兩者的系統身份、種族、髮色、瞳色、耳形與氣息資料仍分離。\n- Franiya與【折光】是同一人。')
          p.write_text(s, encoding='utf-8')

          p = root / '04_連續性與索引/06H_章節索引_第59章增量.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace('11. Franiya在安全區域切換第二身份【折光】；身份切換鎖1小時啟動，羽毛任務仍6／200。',
                        '11. Franiya在安全區域切換第二身份【折光】；身份切換鎖1小時啟動，羽毛任務仍6／200。折光外觀固定為白色長髮、璀璨金瞳、精靈耳，五官與主身份相同；白髮來自「家人中不少人都是白髮，所以自己也想試試看」的私人巧思。近乎神性的感覺僅屬氣質描述。')
          s = s.replace('16. 公共世界第一次出現【折光】法師PvP素材，但沒有證據與Franiya公開綁定。',
                        '16. 公共世界第一次出現【折光】法師PvP素材。因兩身份五官相同，高品質素材可形成「長得很像」的合理線索，但仍沒有足以確認兩個系統身份為同一人的證據。')
          p.write_text(s, encoding='utf-8')

          p = root / '04_連續性與索引/08_原著事件待處理佇列.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace('- 原著【雨天決行】／影子的弟子候選／華夏遊戲界希望之星等資訊只能在合法來源揭露後進Franiya知識。',
                        '- 原著【雨天決行】／影子的弟子候選／華夏遊戲界希望之星等資訊只能在合法來源揭露後進Franiya知識。\n- 折光RETRO外觀＝白色長髮／璀璨金瞳／精靈耳／與主身份相同五官。第四人若有合法看過Franiya公開素材，可以注意到外貌相似，但不得因此直接知道兩身份同一。')
          s = s.replace('- 保留霓裳／清酒牧歌／高端圈利用流量、推理頂級玩家行為與品牌的功能，但具體內容需依本線事實重建。',
                        '- 保留霓裳／清酒牧歌／高端圈利用流量、推理頂級玩家行為與品牌的功能，但具體內容需依本線事實重建。\n- 由於折光與Franiya五官相同，第114～115章等價媒體／高端玩家分析可合法產生「兩人長得高度相似」的討論；這只能作推測線索，不能越級成身份實錘。')
          p.write_text(s, encoding='utf-8')

          p = root / '04_連續性與索引/07_有效性與同步稽核.md'
          s = p.read_text(encoding='utf-8')
          if '## 十、【折光】外觀RETRO稽核' not in s:
              s += '''\n\n---\n\n## 十、【折光】外觀RETRO稽核（2026-09-30）\n\n- 舊值：淺栗長髮／灰綠瞳／系統調開五官辨識點。\n- 新值：白色長髮／璀璨金瞳／精靈耳／五官與主身份相同。\n- 白髮選擇動機：Franiya家人中有不少白髮，她長期看習慣也覺得好看，因此建立第二身份時帶著「想試試看」的私人巧思選了白髮；不是模仿特定家人。\n- 「帶一點神性的感覺」只作視覺與氣質描述，不代表神祇種族、位格或生命層級。\n- 正文回改點：第49章建立外觀、第50章首次切換／切回、第59章再次切換與旁觀視線。\n- 下游知識邊界：同五官可形成外貌相似線索，但`VISUAL_RESEMBLANCE != IDENTITY_PROOF`；系統身份／種族／氣息仍獨立。\n\n`ZHEGUANG_APPEARANCE_RETRO = PASS`\n`VISUAL_RESEMBLANCE_CLUE = LEGAL`\n`VISUAL_RESEMBLANCE_IS_NOT_IDENTITY_PROOF = TRUE`\n'''
          p.write_text(s, encoding='utf-8')

          (root / '02_角色設定/13_折光外觀與白髮選擇補充.md').write_text('''# 折光外觀與白髮選擇補充\n\n> 狀態：`CURRENT_CANON / AUTHORITATIVE_OVERLAY`  \n> 日期：2026-09-30\n\n## 一、固定外觀\n- 白色長髮。\n- 璀璨金色眼睛。\n- 精靈種耳朵保留。\n- 五官與Franiya主身份保持同一套，不另外換一張臉。\n- 不保留主身份的小狼耳、黑髮與左眼斜向寬繃帶。\n\n## 二、氣質描述邊界\n白髮、金瞳與精靈耳會讓同一套五官呈現一點近乎神性的清透／疏離感。這裡的「神性」僅為視覺與氣質描述，不代表神、神祇種族、位格、生命層級或能力來源。\n\n`DIVINE_LIKE_AESTHETIC != DIVINITY`\n\n## 三、白髮的私人巧思\nFraniya身邊重要的家人中有不少白髮；長期看習慣後，她本來就覺得白髮很好看。建立【折光】時，既然有機會替另一個身份選外觀，她便帶著很輕的「想試試看」心思選了白色長髮。不是模仿某一位家人，而是家庭生活留下的一點審美痕跡。\n\n## 四、身份辨識邊界\n- 【折光】與Franiya的系統身份、種族、職業接口與氣息仍然獨立。\n- 因五官相同，看過兩者高品質影像／近距離外貌的人，可以合理注意到「長得高度相似」。\n- 外貌相似只能構成推測線索，不能自動證明兩個ID是同一玩家。\n\n`SAME_FACIAL_FEATURES = TRUE`\n`VISUAL_RESEMBLANCE_CLUE = LEGAL`\n`VISUAL_RESEMBLANCE != IDENTITY_PROOF`\n''', encoding='utf-8')

          (root / '08_劇情規劃/188_折光外觀與家庭白髮巧思RETRO修復_v1.0.md').write_text('''# 折光外觀與家庭白髮巧思 RETRO 修復 v1.0\n\n> 日期：2026-09-30  \n> 狀態：`RETRO_APPLIED / PENDING_FINAL_GIT_VERIFY`\n\n## 本輪修正\n- 折光：淺栗長髮 → 白色長髮。\n- 折光：灰綠瞳 → 璀璨金瞳。\n- 五官：系統另行調整 → 與Franiya主身份相同。\n- 精靈耳：保留。\n- 新增白髮選擇動機：家人中不少白髮，Franiya覺得好看，所以想試試看；非模仿特定家人。\n- 「近乎神性」只為外觀／氣質描述，不是神性身份或生命層級。\n\n## 正文回改\n- 第49章：首次建立折光外觀與選色動機。\n- 第50章：首次實際切換、行動中外觀、切回主身份。\n- 第59章：再次切換與旁觀者視線。\n\n## 同步\nSOURCE 24、Current State、知識矩陣04L、索引06H、有效性稽核、Active Queue、專案交接、角色設定13均同步。\n\n## 下游影響\n`VISUAL_RESEMBLANCE_CLUE = LEGAL`：同五官可讓觀察者合理注意兩身份長得很像。\n`VISUAL_RESEMBLANCE != IDENTITY_PROOF`：外貌相似不等於身份實錘。113～115等價的觀察／媒體分析必須納入這條新線索。\n\n## VOID\n本輪未使用VOID_WITH_CAUSE。\n''', encoding='utf-8')

          authoritative = [
              '01_章節/049_第四十九章_五秒有點多.md',
              '01_章節/050_第五十章_這裡真的掉過一顆星.md',
              '01_章節/059_第五十九章_名字可以晚一點.md',
              '05_原著參考/24_SOURCE_NODE_千幻之心第二身份與Franiya法師線回修.md',
              '04_連續性與索引/01_當前狀態快照.md',
              '00_專案交接.md',
          ]
          stale = []
          for rel in authoritative:
              text = (root / rel).read_text(encoding='utf-8')
              if any(x in text for x in ('淺栗', '灰綠瞳', '灰綠色眼睛')):
                  stale.append(rel)
          if stale:
              raise SystemExit('STALE ACTIVE APPEARANCE FOUND:\n' + '\n'.join(stale))
          PY

          git config user.name "Secileya"
          git config user.email "xw4761645@gmail.com"
          git add "小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）"
          git diff --cached --check
          git commit -m "retro(zheguang): 回改白髮金瞳與家庭巧思 [zheguang-retro]"
          git push origin main
