name: Retro Zheguang Appearance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retro:
    if: ${{ !contains(github.event.head_commit.message, '[zheguang-retro]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply retro appearance patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')

          def replace_exact(rel, old, new):
              p = root / rel
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'MISSING EXPECTED TEXT: {rel} :: {old[:80]!r}')
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          # 第49章：建立折光時，直接回改外觀與白髮選擇動機。
          replace_exact(
              '01_章節/049_第四十九章_五秒有點多.md',
              '左眼沒有繃帶。\n\n黑髮改成淺栗色長髮，眼睛調成灰綠色，五官在系統允許範圍內重新拉開辨識差異。精靈種族本身的耳形則自然保留。\n\n不是為了變得更漂亮。\n\n只是讓兩張臉不需要靠「別人沒看清」才能區分。',
              '左眼沒有繃帶。\n\n黑髮改成白色長髮，眼睛換成璀璨金色。五官沒有換成另一張臉，仍然是她原本的樣子；白髮、金瞳與精靈耳把同一套五官襯得更清透，也多了一點近乎神性的感覺。那只是外觀與氣質上的印象，不代表任何「神」種族、位格或生命層級。精靈種族本身的耳形則自然保留。\n\n白髮是她自己挑的。\n\n家裡白頭髮的人很多。平常看得久了，她一直覺得很好看。現在既然是在替另一個身份選外觀，就順手想試一次。\n\n不是為了模仿哪一個人。\n\n只是想試試看。\n\n身份本身的種族、髮色、瞳色、耳形與氣息已經足夠把兩套對外資料分開，沒有必要再把她的五官改成另一張臉。'
          )

          # 第50章：第一次實際切換與切回。
          replace_exact(
              '01_章節/050_第五十章_這裡真的掉過一顆星.md',
              '沒有把人拆散再重組的劇烈感覺，只是系統對外承認的那層身份在極短時間裡換了一套接口。黑髮先褪成淺栗色，長度落到背後；狼耳消失，取而代之的是精靈種族向後延伸的耳形。左眼上的斜向繃帶不見了，兩隻眼睛都變成灰綠色，原本容易和Franiya直接重疊的五官辨識點也被系統重新調開。',
              '沒有把人拆散再重組的劇烈感覺，只是系統對外承認的那層身份在極短時間裡換了一套接口。黑髮先褪成白色，長度落到背後；狼耳消失，取而代之的是精靈種族向後延伸的耳形。左眼上的斜向繃帶不見了，兩隻眼睛都變成璀璨金色。五官沒有被系統換成另一張臉，仍然是Franiya原本的樣子；只是白髮、金瞳與精靈耳把同一套五官托出一點近乎神性的清透感。那只是看起來的氣質，不是任何神性種族或生命層級判定。'
          )
          replace_exact(
              '01_章節/050_第五十章_這裡真的掉過一顆星.md',
              '沒有狼耳之後，少了一個會自己洩漏細微注意方向的部位，反而讓她的外觀更難讀。淺栗色長髮在肩後晃動，灰綠色眼睛掃過銀灰樹根與黑色落葉，腳上那雙【靈動祝福之靴】仍是同一件裝備。',
              '沒有狼耳之後，少了一個會自己洩漏細微注意方向的部位，反而讓她的外觀更難讀。白色長髮在肩後晃動，璀璨金色眼睛掃過銀灰樹根與黑色落葉，腳上那雙【靈動祝福之靴】仍是同一件裝備。'
          )
          replace_exact(
              '01_章節/050_第五十章_這裡真的掉過一顆星.md',
              '淺栗色長髮重新收回黑色，精靈耳消失，小狼耳回到頭頂；左眼斜向寬繃帶重新覆上，右眼也恢復成原本的深色豎瞳。',
              '白色長髮重新收回黑色，精靈耳消失，小狼耳回到頭頂；左眼斜向寬繃帶重新覆上，右眼也恢復成原本的深色豎瞳。'
          )

          # 第59章：再次切換與第四名旁觀者視線。
          replace_exact(
              '01_章節/059_第五十九章_名字可以晚一點.md',
              '身份切換成立的瞬間，狼耳消失，黑色長髮被淺栗色長髮取代，左眼斜向繃帶也不見了。灰綠色眼睛睜開時，系統裡那個屬於Franiya主身份的外貌、職業與氣息已經被另一套完整資料接管。',
              '身份切換成立的瞬間，狼耳消失，黑色長髮被白色長髮取代，左眼斜向繃帶也不見了。璀璨金色眼睛睜開時，五官仍然是她原本的樣子，只是白髮、金瞳與精靈耳把同一張臉襯出一點近乎神性的疏離感；系統裡屬於Franiya主身份的職業、種族與氣息則已經被另一套完整資料接管。'
          )
          replace_exact(
              '01_章節/059_第五十九章_名字可以晚一點.md',
              '那雙灰綠色眼睛從來沒有「剛好」看向這裡。',
              '那雙璀璨金色眼睛從來沒有「剛好」看向這裡。'
          )

          # SOURCE_CANON：外觀、動機、語義邊界。
          replace_exact(
              '05_原著參考/24_SOURCE_NODE_千幻之心第二身份與Franiya法師線回修.md',
              '- 外貌：淺栗色長髮、灰綠瞳、精靈耳；不保留主身份小狼耳、左眼斜向繃帶、黑髮與深色豎瞳組合；五官於系統允許範圍內重新調整。',
              '- 外貌：白色長髮、璀璨金瞳、精靈耳；不保留主身份小狼耳、左眼斜向繃帶、黑髮與深色豎瞳組合。五官與主身份保持同一套，不另換一張臉；白髮、金瞳與精靈耳使整體呈現一點近乎神性的氣質，但這只是一種外觀／氣質描述，不代表任何「神」種族、位格或生命層級。白髮是Franiya自行選擇的巧思：因家人中有不少白髮，她長期看習慣也覺得好看，所以建立【折光】時帶著「想試試看」的心思選了白髮；不是模仿某一位家人。'
          )

          # Current State。
          replace_exact(
              '04_連續性與索引/01_當前狀態快照.md',
              '- 淺栗長髮、灰綠瞳、精靈耳；無主身份狼耳、黑髮、左眼斜向繃帶。',
              '- 白色長髮、璀璨金瞳、精靈耳；五官與主身份相同，無主身份狼耳、黑髮、左眼斜向繃帶。白髮源於Franiya因家人中不少人都是白髮、自己看習慣也覺得好看，所以建立第二身份時想試試看的私人巧思。整體帶一點近乎神性的氣質，但僅為外觀描述，不代表任何神祇種族／位格／生命層級。'
          )

          # Handoff。
          replace_exact(
              '00_專案交接.md',
              '- 【折光】：Lv10精靈法師／50精神／淺栗長髮／灰綠瞳／精靈耳／身份氣息獨立。',
              '- 【折光】：Lv10精靈法師／50精神／白色長髮／璀璨金瞳／精靈耳／五官與主身份相同／身份氣息獨立；白髮是因家人中不少人都是白髮、她覺得好看而想試試看的私人巧思。整體可呈現一點近乎神性的氣質，但僅為外觀描述，不代表任何神祇種族、位格或生命層級。'
          )

          # 第59章知識矩陣：同五官會形成可被觀察的相似線索，但不等於身份證明。
          p = root / '04_連續性與索引/04L_角色知識矩陣_第59章增量.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '### 可知道\n- 月神神殿候補神使洛曾在日光森林與Franiya爆發高階戰鬥。',
              '### 可知道\n- 【折光】外觀為白色長髮、璀璨金瞳與精靈耳；五官本身與Franiya主身份相同。看過兩套高品質影像的人可以合理注意到臉部結構高度相似，但這只構成外貌線索，不能直接證明兩個ID／身份屬於同一人。\n- 月神神殿候補神使洛曾在日光森林與Franiya爆發高階戰鬥。'
          )
          s = s.replace(
              '### 不可知道\n- Franiya與【折光】是同一人。',
              '### 不可知道\n- 僅憑相同五官就確認Franiya與【折光】是同一人；兩者的系統身份、種族、髮色、瞳色、耳形與氣息資料仍分離。\n- Franiya與【折光】是同一人。'
          )
          p.write_text(s, encoding='utf-8')

          # 第59章索引補上外觀RETRO及相似線索。
          p = root / '04_連續性與索引/06H_章節索引_第59章增量.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '11. Franiya在安全區域切換第二身份【折光】；身份切換鎖1小時啟動，羽毛任務仍6／200。',
              '11. Franiya在安全區域切換第二身份【折光】；身份切換鎖1小時啟動，羽毛任務仍6／200。折光外觀固定為白色長髮、璀璨金瞳、精靈耳，五官與主身份相同；白髮來自「家人中不少人都是白髮，所以自己也想試試看」的私人巧思。近乎神性的感覺僅屬氣質描述。'
          )
          s = s.replace(
              '16. 公共世界第一次出現【折光】法師PvP素材，但沒有證據與Franiya公開綁定。',
              '16. 公共世界第一次出現【折光】法師PvP素材。因兩身份五官相同，高品質素材可形成「長得很像」的合理線索，但仍沒有足以確認兩個系統身份為同一人的證據。'
          )
          p.write_text(s, encoding='utf-8')

          # Queue：把外貌相似性帶入113～115媒體分析窗口。
          p = root / '04_連續性與索引/08_原著事件待處理佇列.md'
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '- 原著【雨天決行】／影子的弟子候選／華夏遊戲界希望之星等資訊只能在合法來源揭露後進Franiya知識。',
              '- 原著【雨天決行】／影子的弟子候選／華夏遊戲界希望之星等資訊只能在合法來源揭露後進Franiya知識。\n- 折光RETRO外觀＝白色長髮／璀璨金瞳／精靈耳／與主身份相同五官。第四人若有合法看過Franiya公開素材，可以注意到外貌相似，但不得因此直接知道兩身份同一。'
          )
          s = s.replace(
              '- 保留霓裳／清酒牧歌／高端圈利用流量、推理頂級玩家行為與品牌的功能，但具體內容需依本線事實重建。',
              '- 保留霓裳／清酒牧歌／高端圈利用流量、推理頂級玩家行為與品牌的功能，但具體內容需依本線事實重建。\n- 由於折光與Franiya五官相同，第114～115章等價媒體／高端玩家分析可合法產生「兩人長得高度相似」的討論；這只能作推測線索，不能越級成身份實錘。'
          )
          p.write_text(s, encoding='utf-8')

          # 有效性稽核：加入本輪RETRO驗收。
          p = root / '04_連續性與索引/07_有效性與同步稽核.md'
          s = p.read_text(encoding='utf-8')
          extra = '''\n\n---\n\n## 十、【折光】外觀RETRO稽核（2026-09-30）\n\n- 舊值：淺栗長髮／灰綠瞳／系統調開五官辨識點。\n- 新值：白色長髮／璀璨金瞳／精靈耳／五官與主身份相同。\n- 白髮選擇動機：Franiya家人中有不少白髮，她長期看習慣也覺得好看，因此建立第二身份時帶著「想試試看」的私人巧思選了白髮；不是模仿特定家人。\n- 「帶一點神性的感覺」只作視覺與氣質描述，不代表神祇種族、位格或生命層級。\n- 正文回改點：第49章建立外觀、第50章首次切換／切回、第59章再次切換與旁觀視線。\n- 下游知識邊界：同五官可形成外貌相似線索，但`VISUAL_RESEMBLANCE != IDENTITY_PROOF`；系統身份／種族／氣息仍獨立。\n\n`ZHEGUANG_APPEARANCE_RETRO = PASS`\n`VISUAL_RESEMBLANCE_CLUE = LEGAL`\n`VISUAL_RESEMBLANCE_IS_NOT_IDENTITY_PROOF = TRUE`\n'''
          if '## 十、【折光】外觀RETRO稽核' not in s:
              s += extra
          p.write_text(s, encoding='utf-8')

          # 新角色設定補充。
          p = root / '02_角色設定/13_折光外觀與白髮選擇補充.md'
          p.write_text('''# 折光外觀與白髮選擇補充\n\n> 狀態：`CURRENT_CANON / AUTHORITATIVE_OVERLAY`  \n> 日期：2026-09-30\n\n## 一、固定外觀\n\n- 白色長髮。\n- 璀璨金色眼睛。\n- 精靈種耳朵保留。\n- 五官與Franiya主身份保持同一套，不另外換一張臉。\n- 不保留主身份的小狼耳、黑髮與左眼斜向寬繃帶。\n\n## 二、氣質描述邊界\n\n白髮、金瞳與精靈耳會讓同一套五官呈現一點近乎神性的清透／疏離感。\n\n此處「神性」**僅為視覺與氣質描述**：\n- 不代表折光是神；\n- 不代表神祇種族；\n- 不代表位格；\n- 不代表生命層級；\n- 不代表能力來源。\n\n`DIVINE_LIKE_AESTHETIC != DIVINITY`\n\n## 三、白髮的私人巧思\n\nFraniya選白髮不是隨機配色，也不是模仿某一位家人。\n\n她身邊重要的家人中有不少白髮；長期看習慣後，她本來就覺得白髮很好看。建立【折光】時，既然有機會替另一個身份選外觀，她便帶著很輕的「想試試看」心思選了白色長髮。\n\n這是角色自己的小審美與家庭生活痕跡，不需要寫成沉重象徵或煽情宣言。\n\n## 四、身份辨識邊界\n\n- 【折光】與Franiya的系統身份、種族、職業接口與氣息仍然獨立。\n- 但因五官相同，看過兩者高品質影像／近距離外貌的人，可以合理注意到「長得高度相似」。\n- 外貌相似只能構成推測線索，不能自動證明兩個ID是同一玩家。\n\n`SAME_FACIAL_FEATURES = TRUE`\n`VISUAL_RESEMBLANCE_CLUE = LEGAL`\n`VISUAL_RESEMBLANCE != IDENTITY_PROOF`\n''', encoding='utf-8')

          # 新RETRO交易同步。
          p = root / '08_劇情規劃/188_折光外觀與家庭白髮巧思RETRO修復_v1.0.md'
          p.write_text('''# 折光外觀與家庭白髮巧思 RETRO 修復 v1.0\n\n> 日期：2026-09-30  \n> 狀態：`RETRO_APPLIED / TRANSACTION_PENDING_GIT_VERIFY`\n\n## 一、使用者修正\n\n【折光】外觀正式改為：\n- 白色長髮；\n- 璀璨金瞳；\n- 精靈耳保留；\n- 五官與Franiya主身份相同；\n- 整體帶一點近乎神性的氣質，但只屬外觀描述，不代表任何神祇種族、位格或生命層級。\n\n白髮選擇補充：Franiya因家人中有不少白髮，長期看習慣也覺得好看，因此建立第二身份時帶著「想試試看」的心思選了白髮；不是模仿特定家人。\n\n## 二、正文回改\n\n- 第49章：回改第一次建立折光外觀，加入白髮選擇的家庭巧思。\n- 第50章：回改第一次實際切換、行動中外觀、切回主身份。\n- 第59章：回改再次切換與第四名潛行者觀察到的眼睛顏色。\n\n## 三、同步回改\n\n- `05_原著參考/24_SOURCE_NODE_千幻之心第二身份與Franiya法師線回修.md`\n- `04_連續性與索引/01_當前狀態快照.md`\n- `04_連續性與索引/04L_角色知識矩陣_第59章增量.md`\n- `04_連續性與索引/06H_章節索引_第59章增量.md`\n- `04_連續性與索引/07_有效性與同步稽核.md`\n- `04_連續性與索引/08_原著事件待處理佇列.md`\n- `00_專案交接.md`\n- 新增`02_角色設定/13_折光外觀與白髮選擇補充.md`。\n\n## 四、下游新影響\n\n五官相同帶來新的合法公開推理線：\n- 高品質影像／近距離目擊者可以注意到Franiya與折光臉部結構高度相似；\n- 這可能進入113～115章等價的高端玩家／媒體分析；\n- 但不能直接實錘兩個系統身份同一。\n\n`VISUAL_RESEMBLANCE_CLUE = LEGAL`\n`VISUAL_RESEMBLANCE_IS_NOT_IDENTITY_PROOF = TRUE`\n\n## 五、VOID\n\n本輪未使用VOID_WITH_CAUSE。\n\n## 六、下一步\n\n第60章PREWRITE必須以新外觀為唯一權威，並重新納入「外貌相似線索」的知識邊界。\n''', encoding='utf-8')

