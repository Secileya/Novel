name: Finalize Franiya Integrity Audit

on:
  push:
    paths:
      - '.github/workflows/finalize-franiya-integrity-audit.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          START_HEAD="ff8c21ff8c3bd04bd05429270b2910df8093cfab"
          export START_HEAD
          python - <<'PY'
          from pathlib import Path
          import os
          root=Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')
          wf=root/'07_工作流程'
          idx=root/'04_連續性與索引'
          plan=root/'08_劇情規劃'

          def save(p,s):
              p.write_text(s.rstrip()+'\n',encoding='utf-8')

          # Fix explicit stale metadata.
          p=wf/'05_正文事件佇列自動讀取與章節交易.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('> 最後強化：2026-09-29','> 最後強化：2026-09-30',1)
          save(p,s)

          # Formal audit result in validity ledger.
          p=idx/'07_有效性與同步稽核.md'
          s=p.read_text(encoding='utf-8')
          heading='## 十三、2026-09-30全專案一致性／流程自舉稽核'
          section='''
## 十三、2026-09-30全專案一致性／流程自舉稽核

### 發現並修正的現行缺口
1. **沒有獨立裝備／資產Current Ledger**：已新增`04_連續性與索引/09_裝備與資產權威總表.md`。
2. **新對話主提示詞最小包落後於後加流程**：原本未強制納入04能力Gate、07事件密度、10 VOID公開、14全變更公開與資產Ledger；已補齊，並新增15號總Gate作唯一完整收口。
3. **01長期循環與04／05施工入口可能被單獨讀取而繞過後加Gate**：已在檔頭接向15號總Gate；04／05同時明示09號資產Ledger。
4. **05章節交易的「最後強化」仍停在2026-09-29**：已改為2026-09-30；完整封口條件由15號總Gate補足資產Ledger、能力完整評估、VOID公開、原著逐章事件回報、全變更公開與bootstrap Gate。
5. **Franiya痛覺形成史雖已修正文與Current State，但新對話入口未強制讀跨世界補充**：15號總Gate與00號新對話主提示詞現已固定要求涉及受傷／疼痛時讀`小說/家庭總檔/10_芙蘭妮雅痛覺形成史補充.md`。

### 過時訊息掃描結論
- `淺栗長髮／灰綠瞳`：現行正文、Current State、角色設定與施工入口不再採用；只允許出現在188等RETRO「舊值」歷史說明。
- `【海潮】未取得`：現行權威固定為【深海水晶球】裝備技能`AVAILABLE_IF_ORB_EQUIPPED`；舊字樣只允許出現在185覆蓋聲明等歷史修正說明。
- `8000～12000`：現行新章規則固定`9000～14000`；舊PREWRITE可保存當時施工歷史，07/03只以明確「舊值」身份提及。
- `Franiya主動關閉痛覺／先天無痛`：現行權威禁止；當前0主觀痛覺來自長期經歷逐步鈍化。

### 新總Gate
`BOOTSTRAP_GATE = REQUIRED`
`ASSET_LEDGER_PREWRITE_GATE = REQUIRED`
`ASSET_LEDGER_POSTWRITE_SYNC = REQUIRED`
`CURRENT_AUTHORITY_STALE_VALUE_COUNT = 0`
`ALL_CHANGE_DISCLOSURE_GATE = REQUIRED`

歷史工作檔不因保存舊值自動算矛盾，前提是其身份明確為歷史／SUPERSEDED／RETRO記錄，且現行入口不再引用舊值施工。
'''
          if heading not in s:
              save(p,s.rstrip()+section)

          # Formal audit report.
          report=plan/'194_全專案一致性與流程可交接性稽核_v1.0.md'
          report_text=f'''# 全專案一致性與流程可交接性稽核 v1.0

> 日期：2026-09-30  
> 稽核起始main HEAD：`{os.environ['START_HEAD']}`  
> 狀態：`AUDIT_REPAIRS_APPLIED / PENDING_BODY_COMMIT`

## 一、稽核範圍
- 專案交接、Current State、未完成因果、有效性稽核、Active Queue。
- 07工作流程的bootstrap、能力Gate、SOURCE、事件密度、VOID、全變更公開與章節交易。
- 近期RETRO敏感項：折光舊外觀、海潮未取得、痛覺主動關閉語義、舊章容量。
- 裝備／資產是否存在獨立Current Ledger，以及新對話是否會讀到它。

## 二、發現
1. 裝備資訊原先散在Current State／章節索引／POSTWRITE，缺少獨立Current Ledger。
2. 新對話最小包與舊施工入口未完整吸收9/30後新增Gate。
3. 05章節交易的更新日期與完整封口條件落後。
4. 痛覺形成史已在角色層修正，但bootstrap原先未硬性連到跨世界補充。
5. 舊外觀、海潮未取得、8000～12000目前主要只殘留在明確歷史修正／舊PREWRITE；不能讓這些歷史值回流現行施工。

## 三、本輪修正
- NEW：`04_連續性與索引/09_裝備與資產權威總表.md`。
- NEW：`07_工作流程/15_新對話完整啟動與章節交易總Gate.md`。
- MODIFIED：`07/00`新對話主提示詞。
- MODIFIED：`07/01`、`07/04`、`07/05`加入15號總Gate／09號Ledger上位指向。
- MODIFIED：`00_專案交接.md`、Current State、Active Queue加入新入口與資產Ledger指向。
- MODIFIED：`04/07_有效性與同步稽核.md`記錄本輪一致性結果。

## 四、故事／來源狀態
- `CURRENT_FORMAL_CHAPTER = 059`
- `NEXT_FORMAL_CHAPTER = 060`
- `EVENT_CONSUMPTION_CURSOR = THROUGH_CH112`
- `CH113 = READY_NOW / TOUCHED_NOT_CONSUMED`
- 本輪沒有施工第60章，也沒有消耗新的原著章事件。

## 五、VOID
本輪未使用`VOID_WITH_CAUSE`。這是流程與資料一致性修復，不改原著事件 disposition。

## 六、歷史資料保留原則
舊PREWRITE／POSTWRITE／RETRO可保留當時舊值，因它們是歷史證據；但必須可辨認為歷史／SUPERSEDED／RETRO。現行Current Authority、Queue與bootstrap不得採用那些舊值。
'''
          save(report,report_text)

          # Targeted current-authority stale scan.
          current=[
              root/'00_專案交接.md',
              idx/'01_當前狀態快照.md',
              idx/'02_未完成因果與待定事項.md',
              idx/'08_原著事件待處理佇列.md',
              idx/'09_裝備與資產權威總表.md',
              wf/'00_新對話長期主提示詞.md',
              wf/'01_原著改寫長期循環.md',
              wf/'04_施工門禁與Franiya能力Gate補充.md',
              wf/'05_正文事件佇列自動讀取與章節交易.md',
              wf/'07_原著事件消耗與章節內容密度規則.md',
              wf/'10_VOID_WITH_CAUSE使用者公開回報硬門檻.md',
              wf/'14_使用者最終回報全變更公開硬門檻.md',
              wf/'15_新對話完整啟動與章節交易總Gate.md',
          ]
          required=current+[
              Path('小說/家庭總檔/10_芙蘭妮雅痛覺形成史補充.md'),
              root/'02_角色設定/11_Franiya能力技巧與使用區段施工總表.md',
              root/'02_角色設定/12_Franiya施法前兆威力與效果解析補充.md',
              root/'02_角色設定/13_折光外觀與白髮選擇補充.md',
          ]
          missing=[str(x) for x in required if not x.exists()]
          if missing:
              raise SystemExit('MISSING_REQUIRED='+repr(missing))

          forbidden=[
              '淺栗長髮',
              '灰綠瞳',
              '未取得正式【海潮】',
              '她自己不會把傷害轉成主觀疼痛',
          ]
          bad=[]
          for f in current:
              txt=f.read_text(encoding='utf-8')
              for x in forbidden:
                  if x in txt:
                      bad.append((str(f),x))
          if bad:
              raise SystemExit('STALE_CURRENT_AUTHORITY='+repr(bad))

          # New bootstrap must reference core late-added gates.
          bootstrap=(wf/'00_新對話長期主提示詞.md').read_text(encoding='utf-8')
          for token in ['15_新對話完整啟動與章節交易總Gate.md','09_裝備與資產權威總表.md','10_VOID_WITH_CAUSE','14_使用者最終回報全變更公開硬門檻','9000_TO_14000']:
              if token not in bootstrap:
                  raise SystemExit('BOOTSTRAP_MISSING='+token)

          # Recent formal chapters should not contain superseded appearance/pain wording.
          for chap in [
              root/'01_章節/049_第四十九章_五秒有點多.md',
              root/'01_章節/050_第五十章_這裡真的掉過一顆星.md',
              root/'01_章節/059_第五十九章_名字可以晚一點.md',
          ]:
              txt=chap.read_text(encoding='utf-8')
              if '淺栗' in txt or '灰綠' in txt or '她自己不會把傷害轉成主觀疼痛' in txt:
                  raise SystemExit('STALE_FORMAL_CHAPTER='+str(chap))
          PY

          rm -f .github/workflows/finalize-franiya-integrity-audit.yml
          git diff --check
          git config user.name Secileya
          git config user.email xw4761645@gmail.com
          git add -A
          git commit -m "audit: 完成全專案一致性與流程可交接性稽核"
          BODY_SHA="$(git rev-parse HEAD)"
          export BODY_SHA

          python - <<'PY'
          from pathlib import Path
          import os
          root=Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')
          p=root/'08_劇情規劃/194_全專案一致性與流程可交接性稽核_v1.0.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('`AUDIT_REPAIRS_APPLIED / PENDING_BODY_COMMIT`','`AUDIT_REPAIRS_APPLIED / BODY_COMMIT_VERIFIED`')
          s += f'''\n## 七、本體Commit\n- `AUDIT_BODY_COMMIT = {os.environ["BODY_SHA"]}`\n- `CURRENT_AUTHORITY_STALE_VALUE_COUNT = 0`\n- `BOOTSTRAP_GATE = PASS`\n- `ASSET_LEDGER_GATE = PASS`\n'''
          p.write_text(s.rstrip()+'\n',encoding='utf-8')

          close=root/'08_劇情規劃/195_全專案一致性與流程自舉稽核交易關閉_v1.0.md'
          close.write_text(f'''# 全專案一致性與流程自舉稽核｜交易關閉 v1.0\n\n> 日期：2026-09-30\n\n## 本體\n- `AUDIT_BODY_COMMIT = {os.environ["BODY_SHA"]}`\n- `START_HEAD_BEFORE_AUDIT = {os.environ["START_HEAD"]}`\n\n## Gate\n- `CURRENT_AUTHORITY_STALE_VALUE_COUNT = 0`\n- `BOOTSTRAP_GATE = PASS`\n- `ASSET_LEDGER_CREATED = PASS`\n- `ASSET_LEDGER_PREWRITE_GATE = REQUIRED`\n- `ASSET_LEDGER_POSTWRITE_SYNC = REQUIRED`\n- `FRANIYA_ABILITY_GATE_IN_BOOTSTRAP = PASS`\n- `VOID_DISCLOSURE_GATE_IN_BOOTSTRAP = PASS`\n- `ALL_CHANGE_DISCLOSURE_GATE_IN_BOOTSTRAP = PASS`\n- `ORIGINAL_EVENT_USER_SUMMARY_GATE_IN_BOOTSTRAP = PASS`\n- `CH60_NOT_WRITTEN = TRUE`\n\n## VOID\n本輪未使用`VOID_WITH_CAUSE`。\n\n`FULL_PROJECT_INTEGRITY_AUDIT_TRANSACTION = CLOSED_PENDING_REMOTE_HEAD_VERIFY`\n''',encoding='utf-8')
          PY
          git diff --check
          git add -A
          git commit -m "transaction: 關閉全專案一致性與流程自舉稽核"
          git pull --rebase origin main
          git push origin main
