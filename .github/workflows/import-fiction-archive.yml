name: Import fiction archive

on:
  push:
    branches:
      - import-fiction-archive

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download, validate and unpack archive
        shell: bash
        env:
          ARCHIVE_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-b210-8206-a186-d88815ce300f/raw?se=2026-09-19T14%3A51%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=eb42a16c-0f19-5311-b3d4-2db77d5f43c6&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T01%3A07%3A14Z&ske=2026-09-20T01%3A07%3A14Z&sks=b&skv=2026-02-06&sig=0YEwaT9kwyy5ty7qN6k%2BAZzF7i409cpcfD8ABHRNgZM%3D"
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/fiction-github-export-20260919.zip"
          TARGET="imports/chinese-fiction-archive"
          TMP="$(mktemp -d)"

          curl --fail --location --retry 3 --output "$ZIP" "$ARCHIVE_URL"
          test "$(stat -c '%s' "$ZIP")" = "12345784"

          unzip -t "$ZIP" >/dev/null
          unzip -q "$ZIP" -d "$TMP"

          test -d "$TMP/github_export"

          total="$(find "$TMP/github_export" -type f | wc -l | tr -d ' ')"
          md="$(find "$TMP/github_export" -type f -iname '*.md' | wc -l | tr -d ' ')"
          png="$(find "$TMP/github_export" -type f -iname '*.png' | wc -l | tr -d ' ')"

          test "$total" = "458"
          test "$md" = "452"
          test "$png" = "6"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a "$TMP/github_export/." "$TARGET/"

          test -f "$TARGET/CATALOG.md"
          test -f "$TARGET/GPT_HANDOFF.md"
          test -f "$TARGET/MANIFEST.md"
          test -d "$TARGET/projects"
          test -d "$TARGET/shared"

          rm -rf "$TMP"
          rm -f ".github/workflows/import-fiction-archive.yml"

      - name: Commit imported archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Import Chinese fiction archive from Drive"
          git push origin HEAD:import-fiction-archive
