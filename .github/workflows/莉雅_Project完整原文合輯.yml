name: 莉雅_Project完整原文合輯
on:
  push:
    paths:
      - '.github/workflows/莉雅_Project完整原文合輯.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble original Liya project source documents byte-for-byte
        run: python3 "小說/方九×莉雅（改寫線）/維護工具/組裝莉雅_Project完整原文.py"
      - name: Commit only the generated full compilation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "小說/方九×莉雅（改寫線）/維護工具/莉雅_Project指示_原文不刪改完整合輯.md"
          if ! git diff --cached --quiet; then
            git commit -m "docs(liya): generate 14-source exact full project instructions"
            git push
          fi
