name: 巨構設定索引查詢器驗證
on:
  push:
    paths:
      - '小說/巨構世界（法月懷造物）/**'
      - '.github/workflows/mega-setting-check.yml'
  pull_request:
    paths:
      - '小說/巨構世界（法月懷造物）/**'
      - '.github/workflows/mega-setting-check.yml'
jobs:
  settings-query-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Script syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs'
      - name: Source path integrity
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs' --check
      - name: Fourth semantic source ledger syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第四批原文錨點.mjs'
      - name: Fourth semantic source ledger original anchors
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第四批原文錨點.mjs'
      - name: Fifth semantic source ledger syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第五批原文錨點.mjs'
      - name: Fifth semantic source ledger original anchors
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第五批原文錨點.mjs'
      - name: Migration SHA and five-file validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九章封存五檔遷移.mjs'
      - name: Five-file limit, unchanged original source SHA, and linked audits
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九章封存五檔遷移.mjs'
      - name: Next AI handoff verifier syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs'
      - name: Machine-readable handoff board and source invariants
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --check
      - name: Required per-turn remaining-work and next-step report
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --report > "$RUNNER_TEMP/next-agent-remaining-work.json"
      - name: Dynamic report separates coverage dimensions
        run: |
          node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --report > "$RUNNER_TEMP/mega-coverage.json"
          node -e "const r=require(process.argv[1]), l=require(require('path').resolve(process.argv[2])), c=r.dynamic_coverage;if(c.raw_source_files!==c.direct_fine_grained_source_paths+c.source_role_backlog||c.targeted_reviewed_claims!==r.targeted_reviewed_findings||c.verified_source_quotes!==r.verified_exact_quotes||c.full_file_editorial_accepted!==l.accepted_editorial_file_count||c.full_file_editorial_remaining!==l.remaining_for_full_file_semantic_acceptance||!String(c.full_file_semantic_review_completed).startsWith('EDITORIAL_ATTESTED'))process.exit(2)" "$RUNNER_TEMP/mega-coverage.json" '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_整檔語義驗收台帳.json'
      - name: Handoff next-task route and safe task selection
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --task NEXT > "$RUNNER_TEMP/next-agent-task.json"
      - name: Full-file editorial acceptance validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_整檔語義驗收.mjs'
      - name: Full-file original SHA, line coverage and deliberately broken gap fixture
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_整檔語義驗收.mjs' --negative-test
      - name: Synthetic and real regression checks
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs' --self-test
      - name: Example retrieval receipt
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs' --query 'W01 十二區與舊九區的生態相容性' --receipt "$RUNNER_TEMP/giant-setting-receipt.json" > "$RUNNER_TEMP/giant-setting-stdout.json"
