name: 巨構設定索引查詢器驗證
on:
  push:
    paths:
      - '小說/巨構世界（法月懷造物）/**'
      - '.github/workflows/mega-setting-check.yml'
  pull_request:
    paths:
      - '小說/巨構世界（法月懷造物）/**'
      - '.github/workflows/mega-setting-check.yml'
jobs:
  settings-query-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Script syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs'
      - name: Source path integrity
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs' --check
      - name: Fourth semantic source ledger syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第四批原文錨點.mjs'
      - name: Fourth semantic source ledger original anchors
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第四批原文錨點.mjs'
      - name: Fifth semantic source ledger syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第五批原文錨點.mjs'
      - name: Fifth semantic source ledger original anchors
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第五批原文錨點.mjs'
      - name: Migration SHA and five-file validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九章封存五檔遷移.mjs'
      - name: Five-file limit, unchanged original source SHA, and linked audits
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九章封存五檔遷移.mjs'
      - name: Next AI handoff verifier syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs'
      - name: Machine-readable handoff board and source invariants
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --check
      - name: Required per-turn remaining-work and next-step report
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --report > "$RUNNER_TEMP/next-agent-remaining-work.json"
      - name: Dynamic report separates coverage dimensions
        run: |
          node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --report > "$RUNNER_TEMP/mega-coverage.json"
          node -e "const r=require(process.argv[1]), l=require(require('path').resolve(process.argv[2])), c=r.dynamic_coverage;if(c.raw_source_files!==c.direct_fine_grained_source_paths+c.source_role_backlog+c.new_auto_queued_source_files||c.targeted_reviewed_claims!==r.targeted_reviewed_findings||c.verified_source_quotes!==r.verified_exact_quotes||c.full_file_editorial_accepted!==l.accepted_editorial_file_count||c.full_file_editorial_remaining!==l.remaining_for_full_file_semantic_acceptance||c.all_sources_full_file_accepted+c.all_sources_full_file_pending!==c.raw_source_files||!String(c.full_file_semantic_review_completed).startsWith('EDITORIAL_ATTESTED'))process.exit(2)" "$RUNNER_TEMP/mega-coverage.json" '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_整檔語義驗收台帳.json'
      - name: All current source files dynamic intake syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/全量來源_動態納管與驗收.mjs'
      - name: All 335 plus future new source files are included in uniform full-file QA
        run: |
          node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/全量來源_動態納管與驗收.mjs' --check --negative-test > "$RUNNER_TEMP/mega-live-universe.json"
          node -e "const r=require(process.argv[1]);if(r.source_total<335||r.accepted_full_file_count+r.pending_full_file_count!==r.source_total||r.historical_fine_grained_reference_only!==164||r.historical_role_card_set!==171||r.faults.length)process.exit(2)" "$RUNNER_TEMP/mega-live-universe.json"
          node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/全量來源_動態納管與驗收.mjs' --next > "$RUNNER_TEMP/mega-next-batch-queue.json"
      - name: Handoff next-task route and safe task selection
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_狀態檢查.mjs' --task NEXT > "$RUNNER_TEMP/next-agent-task.json"
      - name: Full-file editorial acceptance validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_整檔語義驗收.mjs'
      - name: Full-file original SHA, line coverage and deliberately broken gap fixture
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/AI接手_整檔語義驗收.mjs' --negative-test
      - name: Batch semantic omission and transitive-impact syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/批量審核_語義缺口與跨批影響.mjs'
      - name: Batch semantic v2 quality gate and negative tests
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/批量審核_語義缺口與跨批影響.mjs' --check --negative-test
      - name: Risk and workload aware next-batch planner
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/批量審核_語義缺口與跨批影響.mjs' --plan > "$RUNNER_TEMP/mega-workload-batch.json"
      - name: Seventh source semantic audit validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第七批原文錨點.mjs'
      - name: Seventh original Git SHA, line and quoted-source audit
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第七批原文錨點.mjs'
      - name: Eighth mixed-164-and-171 source review validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第八批原文錨點.mjs'
      - name: Eighth mixed-164-and-171 original Git SHA, line and exact quote validation
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第八批原文錨點.mjs'
      - name: Ninth batch provisional original-source evidence syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九批原文實讀錨點.mjs'
      - name: Ninth batch source SHA, line and no-premature-attestation validation
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九批原文實讀錨點.mjs'
      - name: Ninth full-source source-anchor syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九批整檔來源錨點.mjs'
      - name: Ninth full-source Git SHA and quote check
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第九批整檔來源錨點.mjs' --negative-test
      - name: Tenth source claim original evidence syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十批整檔來源錨點.mjs'
      - name: Tenth source claim SHA and original quote checks
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十批整檔來源錨點.mjs' --negative-test
      - name: Eleventh source evidence validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十一批原文錨點.mjs'
      - name: Eleventh source SHA quote line and negative evidence tests
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十一批原文錨點.mjs' --negative-test
      - name: Twelfth batch source and anonymous memory validator syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十二批原文與匿名記憶.mjs'
      - name: Twelfth batch SHA quote line negative fixtures and memory anonymity
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十二批原文與匿名記憶.mjs' --negative-test
      - name: Voice library candidate source and syntax check
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/檢查候選正文語氣庫參考.mjs'
      - name: Voice corpus is optional and source changes require renewed receipt
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/檢查候選正文語氣庫參考.mjs' --check --self-test
      - name: Batch13 source evidence syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十三批來源錨點.mjs'
      - name: Batch13 original source SHA and corrupt-proof regression
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證第十三批來源錨點.mjs' --negative-test
      - name: Scoped audit-to-domain graph bridge syntax
        run: node --check '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證審核至既有關係圖_證據橋.mjs'
      - name: All audited claims mapped to existing domain IDs without authority promotion
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/驗證審核至既有關係圖_證據橋.mjs' --negative-test
      - name: Synthetic and real regression checks
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs' --self-test
      - name: Example retrieval receipt
        run: node '小說/巨構世界（法月懷造物）/00_分類導航/設定關聯引擎/查詢.mjs' --query 'W01 十二區與舊九區的生態相容性' --receipt "$RUNNER_TEMP/giant-setting-receipt.json" > "$RUNNER_TEMP/giant-setting-stdout.json"
