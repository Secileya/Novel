name: Retro Franiya Pain History

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retro:
    if: ${{ !contains(github.event.head_commit.message, '[franiya-pain-history]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pain-history retro
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')
          fam = Path('小說/家庭總檔')

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'expected text not found: {p}\n{old}')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

          # 1. 第50章正文：移除「主動轉換／關閉」語感，改成經歷造成的漸進鈍化。
          replace_once(
              root / '01_章節/050_第五十章_這裡真的掉過一顆星.md',
              '她自己不會把傷害轉成主觀疼痛，但她知道疼痛對其他人意味著什麼。更重要的是，芬里爾不是在說一場幾分鐘的戰鬥。',
              '她現在已經感覺不到主觀疼痛了。很久以前不是這樣；只是漫長的經歷把那種感覺一點點磨淡，最後留下的更多是傷害本身、受力與功能變化這些清楚的資訊。她仍然知道疼痛對其他人意味著什麼。更重要的是，芬里爾不是在說一場幾分鐘的戰鬥。'
          )

          # 2. 世界規則：現況0 + 形成史。
          replace_once(
              root / '03_世界觀設定/01_遊戲世界與現實社會基準.md',
              '對Franiya：\n- 主觀痛覺固定等同0，與遊戲痛覺滑桿無關；即使效果標示為精神、靈魂或其他高層痛苦，只要其主要結果仍是「痛」，對她也不形成主觀疼痛。\n- 她仍能感知受力、碰撞、溫度、位置、出血與功能損傷。',
              '對Franiya：\n- **現在**的主觀痛覺固定等同0，與遊戲痛覺滑桿無關；即使效果標示為精神、靈魂或其他高層痛苦，只要其主要結果仍是「痛」，對她也不形成主觀疼痛。\n- 這不是先天無痛，也不是她主動關閉、壓抑、屏蔽或切斷痛覺。她早期原本會正常感到疼痛；只是漫長而反覆的生存、受傷與高壓經歷讓主觀疼痛逐步鈍化、變淡，最後才形成現在的0。\n- 她仍能感知受力、碰撞、溫度、位置、出血與功能損傷。'
          )

          # 3. 角色基準：標題與形成史。
          replace_once(
              root / '02_角色設定/01_芙蘭妮雅與人物勢力反應基準.md',
              '### 痛覺：對她固定等同0\n\n《信仰》原著存在最低痛感／無痛模式，也允許玩家主動開啟真實疼痛效果；但對Franiya而言，**不論遊戲痛覺比例設多少，也不論痛感來源落在肉體、精神、靈魂或其他層次，只要結果仍是「痛」本身，她的主觀感受都固定等同0。**',
              '### 痛覺：現在對她固定等同0\n\nFraniya不是先天沒有痛覺。她早期原本會正常感到疼痛；只是漫長而反覆的生存、受傷與高壓經歷，讓主觀疼痛逐步鈍化、變淡，最後幾乎不再形成「痛」這種主觀感受。這不是她主動關閉、壓抑、屏蔽或切斷痛覺，也不是一個可以隨時開關的能力。\n\n《信仰》原著存在最低痛感／無痛模式，也允許玩家主動開啟真實疼痛效果；但對**現在的**Franiya而言，**不論遊戲痛覺比例設多少，也不論痛感來源落在肉體、精神、靈魂或其他層次，只要結果仍是「痛」本身，她的主觀感受都固定等同0。**'
          )

          # 4. 能力總表：現況與來源分開。
          replace_once(
              root / '02_角色設定/11_Franiya能力技巧與使用區段施工總表.md',
              '- 主觀痛覺0但傷勢與功能狀態感知完整；',
              '- 現在主觀痛覺0，但此狀態由漫長經歷逐步鈍化形成，不是先天無痛或主動關閉；傷勢與功能狀態感知仍完整；'
          )

          # 5. Current State / handoff。
          replace_once(
              root / '04_連續性與索引/01_當前狀態快照.md',
              '- 主觀痛覺0；觸覺、壓力、溫度、失血、角度與功能損傷感知正常。',
              '- 現在主觀痛覺0；早期原本會痛，因漫長經歷逐步鈍化至今，不是先天無痛或主動關閉。觸覺、壓力、溫度、失血、角度與功能損傷感知正常。'
          )
          replace_once(
              root / '00_專案交接.md',
              '- 主觀痛覺0；完整保留傷勢／失血／麻痺／功能感知。',
              '- 現在主觀痛覺0；早期原本會痛，因漫長經歷逐步鈍化至今，不是先天無痛或主動關閉；完整保留傷勢／失血／麻痺／功能感知。家庭總檔權威補充見`10_芙蘭妮雅痛覺形成史補充.md`。'
          )

          # 6. 家庭總檔交接：把新補充升為跨世界必讀。
          hp = fam / '00_總檔交接.md'
          hs = hp.read_text(encoding='utf-8')
          marker = '- **芙蘭妮雅的痛覺形成史另有後期權威補充。**'
          if marker not in hs:
              hs += ('\n- **芙蘭妮雅的痛覺形成史另有後期權威補充。**她早期原本會正常感到疼痛；現在主觀痛覺等同0，是漫長生存、受傷與高壓經歷中逐步鈍化、消退的結果，不是先天無痛，也不是主動關閉／屏蔽痛覺。她仍完整感知傷勢、受力、溫度、失血與功能變化，也仍理解疼痛對其他人意味著什麼。跨世界描寫必須一併參考 `10_芙蘭妮雅痛覺形成史補充.md`；若舊摘要只有「痛覺0」而未說明形成史，以該補充為準。\n')
              hp.write_text(hs, encoding='utf-8')

          # 7. 有效性稽核追加。
          ap = root / '04_連續性與索引/07_有效性與同步稽核.md'
          a = ap.read_text(encoding='utf-8')
          if '## 十一、Franiya痛覺形成史與措辭稽核' not in a:
              a += '''\n\n---\n\n## 十一、Franiya痛覺形成史與措辭稽核（2026-09-30）\n\n- 現況：`CURRENT_SUBJECTIVE_PAIN = 0`。\n- 形成史：早期原本會痛，漫長經歷使主觀疼痛逐步鈍化／消退。\n- 禁止反推：先天無痛、主動關閉痛覺、把傷害「轉換」成非痛訊號。\n- 傷害資訊仍完整：受力／溫度／出血／麻痺／結構與功能變化。\n- 她仍理解別人的疼痛，因為她曾真正會痛，也有完整人生經驗。\n- 第50章「不會把傷害轉成主觀疼痛」已回改。\n\n`PAIN_HISTORY_WORDING_GATE = PASS`\n`CURRENT_ZERO_PAIN != CONGENITAL_ANALGESIA`\n`CURRENT_ZERO_PAIN != ACTIVE_PAIN_SHUTOFF`\n'''
              ap.write_text(a, encoding='utf-8')

          # 8. 交易紀錄。
          tp = root / '08_劇情規劃/192_Franiya痛覺形成史與第50章措辭RETRO_v1.0.md'
          tp.write_text('''# Franiya痛覺形成史與第50章措辭 RETRO v1.0\n\n> 日期：2026-09-30\n> 狀態：`RETRO_APPLIED / PENDING_FINAL_GIT_VERIFY`\n\n## 修正原因\n第50章原句「她自己不會把傷害轉成主觀疼痛」容易誤讀成Franiya主動把痛覺關閉／轉換。\n\n正式因果是：她早期原本會痛；漫長而反覆的生存、受傷與高壓經歷使主觀疼痛逐步鈍化、變淡，最後形成現在主觀痛覺0。\n\n## 同步範圍\n- 第50章正文。\n- 世界規則03/01。\n- 角色基準02/01。\n- 能力施工總表02/11。\n- Current State。\n- 專案交接。\n- 有效性稽核。\n- 家庭總檔00交接。\n- 家庭總檔10痛覺形成史補充。\n\n## 固定邊界\n`ORIGINAL_PAIN_SENSATION = PRESENT`\n`PAIN_DIMINISHED_GRADUALLY_THROUGH_EXPERIENCE = TRUE`\n`CURRENT_SUBJECTIVE_PAIN = 0`\n`CURRENT_SUBJECTIVE_PAIN != CONGENITAL_ANALGESIA`\n`CURRENT_SUBJECTIVE_PAIN != ACTIVE_PAIN_SHUTOFF`\n\n## VOID\n本輪未使用VOID_WITH_CAUSE。\n''', encoding='utf-8')

          # 刪除一次性workflow，不留施工腳手架。
          wf = Path('.github/workflows/retro-franiya-pain-history.yml')
          if wf.exists():
              wf.unlink()
          PY

          git config user.name "Secileya"
          git config user.email "xw4761645@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "retro(franiya): 修正痛覺形成史與第50章措辭 [franiya-pain-history]"
          git push origin main
