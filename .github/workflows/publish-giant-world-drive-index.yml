name: Publish 巨構世界 Drive source index
on:
  push:
    branches: [main]
    paths:
      - '小說/巨構世界（法月懷造物）/**'
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
permissions:
  contents: write
concurrency:
  group: drive-source-index-main
  cancel-in-progress: false
jobs:
  refresh:
    name: Refresh public source index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Build source index
        run: python3 tools/google_drive_mirror/build_source_index.py
      - name: Publish if changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/google_drive_mirror/source-index.json; then
            echo 'Source tree unchanged; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/google_drive_mirror/source-index.json
          git commit -m 'index: refresh 巨構世界 Drive source blobs'
          git push origin HEAD:main
