name: Repair fiction archive filenames

on:
  push:
    branches:
      - import-fiction-archive

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and extract with Python zipfile
        shell: bash
        env:
          ARCHIVE_URL: "https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-eca4-8211-8c20-2555f118e6be/raw?se=2026-09-19T14%3A52%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=6629ae58-a57b-5364-84d0-dc807c3c1a74&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T00%3A35%3A26Z&ske=2026-09-20T00%3A35%3A26Z&sks=b&skv=2026-02-06&sig=XCzpCW1M41DH6GHegDK8vZC2bqaOX1yMv0NDV8gbXUo%3D"
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/fiction-github-export-20260919.zip"
          TARGET="imports/chinese-fiction-archive"
          TMP="$(mktemp -d)"

          curl --fail --location --retry 3 --output "$ZIP" "$ARCHIVE_URL"
          test "$(stat -c '%s' "$ZIP")" = "12345784"

          python - "$ZIP" "$TMP" <<'PY'
          import sys, zipfile
          zip_path, dest = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"Bad ZIP member: {bad}")
              z.extractall(dest)
          PY

          test -d "$TMP/github_export"

          total="$(find "$TMP/github_export" -type f | wc -l | tr -d ' ')"
          md="$(find "$TMP/github_export" -type f -iname '*.md' | wc -l | tr -d ' ')"
          png="$(find "$TMP/github_export" -type f -iname '*.png' | wc -l | tr -d ' ')"

          test "$total" = "458"
          test "$md" = "452"
          test "$png" = "6"

          test -f "$TMP/github_export/projects/apocalypse-liyue/mainline/chapters/001_第1章_末世第一夜，莉月開門.md"
          test -f "$TMP/github_export/projects/wujiezong-sect/chapters/001_第一章_無界宗開山，大帝來敲門.md"

          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -a "$TMP/github_export/." "$TARGET/"

          test -f "$TARGET/CATALOG.md"
          test -f "$TARGET/GPT_HANDOFF.md"
          test -f "$TARGET/MANIFEST.md"
          test -d "$TARGET/projects"
          test -d "$TARGET/shared"

          rm -rf "$TMP"
          rm -f ".github/workflows/repair-fiction-archive.yml"

      - name: Commit repaired import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Repair imported archive filenames"
          git push origin HEAD:import-fiction-archive
