name: Retro Zheguang Motive Boundary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retro:
    if: ${{ !contains(github.event.head_commit.message, '[zheguang-motive-boundary]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply refinement
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')

          def rep(rel, old, new):
              p = root / rel
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'MISSING EXPECTED TEXT: {rel} :: {old[:100]!r}')
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          # 第49章：精靈耳與白髮的家人／安心感動機。
          rep(
              '01_章節/049_第四十九章_五秒有點多.md',
              'Franiya把目前開放的種族列表看完，停在【精靈】。\n\n主身份的人族外觀、狼耳、黑髮、左眼繃帶已經很容易被認出來。既然這個身份本來就要作為獨立入口，沒有必要只改一個名字。\n\n她選下精靈。',
              'Franiya把目前開放的種族列表看完，停在【精靈】。\n\n種族預覽裡，那對向後延伸的長耳讓她多看了一瞬。\n\n薇薇姐姐和希雅姐都有一對很像這種精靈長耳的耳朵。不是同一種族，也不是完全相同的形狀，只是那種細長、向後延伸的耳型本身，對她而言很熟悉。\n\n熟悉的東西看起來會讓人安心。\n\n主身份的人族外觀、狼耳、黑髮、左眼繃帶也已經很容易被認出來。既然這個身份本來就要作為獨立入口，沒有必要只改一個名字。\n\n所以她選下精靈。'
          )
          rep(
              '01_章節/049_第四十九章_五秒有點多.md',
              '白髮是她自己挑的。\n\n家裡白頭髮的人很多。平常看得久了，她一直覺得很好看。現在既然是在替另一個身份選外觀，就順手想試一次。\n\n不是為了模仿哪一個人。\n\n只是想試試看。\n\n身份本身的種族、髮色、瞳色、耳形與氣息已經足夠把兩套對外資料分開，沒有必要再把她的五官改成另一張臉。',
              '白髮是她自己挑的。\n\n家裡白頭髮的人很多。平常看得久了，她一直覺得很好看；而且那種顏色很容易讓她想到熟悉的家人，會讓她覺得安心。現在既然是在替另一個身份選外觀，就順手想試一次。\n\n不是為了模仿哪一個人。\n\n只是喜歡，也安心，所以想試試看。\n\n五官本身不需要換掉。除此之外，對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質和氣息都已經不同；相同的五官只是其中很小的一部分，足以讓兩套對外資料呈現完全不同的整體印象。'
          )

          # 角色設定13：重寫為最新權威。
          p = root / '02_角色設定/13_折光外觀與白髮選擇補充.md'
          p.write_text('''# 折光外觀、家人聯想與身份辨識補充\n\n> 狀態：`CURRENT_CANON / AUTHORITATIVE_OVERLAY`\n> 日期：2026-09-30\n\n## 一、固定外觀\n- 白色長髮。\n- 璀璨金色眼睛。\n- 精靈種長耳保留。\n- 五官與Franiya主身份保持同一套，不另外換一張臉。\n- 不保留主身份的小狼耳、黑髮與左眼斜向寬繃帶。\n\n## 二、氣質描述邊界\n白髮、金瞳與精靈長耳會讓同一套五官呈現一點近乎神性的清透／疏離感。這裡的「神性」僅為視覺與氣質描述，不代表神、神祇種族、位格、生命層級或能力來源。\n\n`DIVINE_LIKE_AESTHETIC != DIVINITY`\n\n## 三、白髮的私人巧思與安心感\nFraniya身邊重要的家人中有不少白髮。她長期看習慣，本來就覺得白髮很好看；同時，這種顏色也很容易讓她聯想到熟悉的家人，因此帶有自然的安心感。\n\n建立【折光】時，既然有機會替另一個身份選外觀，她便帶著很輕的「自己也想試試看」的心思選了白色長髮。這不是模仿某一位家人，而是審美、熟悉感與安心感一起留下的選擇。\n\n`WHITE_HAIR_MOTIVE = AESTHETIC + FAMILIARITY + REASSURANCE`\n\n## 四、選擇精靈種／長耳的私人聯想\nFraniya選擇精靈種時，也有一層很輕的家人聯想。\n\n薇薇姐姐與希雅姐都有類似精靈那樣細長、向後延伸的耳朵。她們不因此等於《信仰》的精靈種，耳型也不需要完全相同；只是Franiya對這類長耳外形本來就非常熟悉，也自然帶有親近與安心感。\n\n所以【折光】的精靈長耳不只是系統種族外觀，也是她會自然覺得順眼、熟悉的選擇。\n\n`ELF_EAR_MOTIVE = VIVI_AND_XIYA_FAMILIAR_LONG_EAR_ASSOCIATION`\n\n## 五、身份辨識邊界：五官相同僅此而已\n【折光】與Franiya相同的只是五官底子。不能把「同五官」擴張成兩個身份整體看起來高度相似。\n\n兩者對外辨識層存在大量明確差異：\n- 對外帳號／角色ID資料不同；\n- 種族不同；\n- 職業不同；\n- 頭髮顏色不同；\n- 眼睛顏色不同；\n- 耳型不同；\n- 整體氣質不同；\n- 身份氣息不同。\n\n因此，即使有人刻意把兩者的高品質正臉畫面並排比較，也最多能注意到「五官底子有相似處」。這是一個局部、弱權重線索，不應自然凌駕於其餘整體差異，更不能單憑臉部五官把兩個身份判定為同一人。\n\n`SAME_FACIAL_FEATURES_ONLY = TRUE`\n`OVERALL_PRESENTATION_DIFFERENT = TRUE`\n`FACIAL_SIMILARITY = WEAK_LOCAL_CLUE_ONLY`\n`FACIAL_SIMILARITY_ALONE != IDENTITY_LINK`\n`FACIAL_SIMILARITY_ALONE != IDENTITY_PROOF`\n''', encoding='utf-8')

          # SOURCE 24。
          rep(
              '05_原著參考/24_SOURCE_NODE_千幻之心第二身份與Franiya法師線回修.md',
              '- 外貌：白色長髮、璀璨金瞳、精靈耳；不保留主身份小狼耳、左眼斜向繃帶、黑髮與深色豎瞳組合。五官與主身份保持同一套，不另換一張臉；白髮、金瞳與精靈耳使整體呈現一點近乎神性的氣質，但這只是一種外觀／氣質描述，不代表任何「神」種族、位格或生命層級。白髮是Franiya自行選擇的巧思：因家人中有不少白髮，她長期看習慣也覺得好看，所以建立【折光】時帶著「想試試看」的心思選了白髮；不是模仿某一位家人。',
              '- 外貌：白色長髮、璀璨金瞳、精靈長耳；不保留主身份小狼耳、左眼斜向繃帶、黑髮與深色豎瞳組合。五官與主身份保持同一套，不另換一張臉；白髮、金瞳與精靈長耳使整體呈現一點近乎神性的氣質，但這只是一種外觀／氣質描述，不代表任何「神」種族、位格或生命層級。白髮來自審美、家人熟悉感與安心感：Franiya家人中有不少白髮，她長期看習慣也覺得好看，因此建立【折光】時帶著「自己也想試試看」的心思選了白髮；不是模仿特定家人。選擇精靈種也帶有私人聯想：薇薇姐姐與希雅姐都有類似精靈的細長耳型，Franiya對這類長耳本來就熟悉、親近且安心。五官相同僅限五官底子；對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息皆不同，不能把同五官擴張成整體高度相似。'
          )

          # Current State。
          rep(
              '04_連續性與索引/01_當前狀態快照.md',
              '- 白色長髮、璀璨金瞳、精靈耳；五官與主身份相同，無主身份狼耳、黑髮、左眼斜向繃帶。白髮源於Franiya因家人中不少人都是白髮、自己看習慣也覺得好看，所以建立第二身份時想試試看的私人巧思。整體帶一點近乎神性的氣質，但僅為外觀描述，不代表任何神祇種族／位格／生命層級。',
              '- 白色長髮、璀璨金瞳、精靈長耳；五官與主身份相同，無主身份狼耳、黑髮、左眼斜向繃帶。白髮的選擇同時來自好看、家人熟悉感與安心感；精靈長耳則因薇薇姐姐與希雅姐都有類似的細長耳型，使Franiya自然覺得熟悉、親近。整體帶一點近乎神性的氣質，但僅為外觀描述，不代表任何神祇種族／位格／生命層級。五官相同僅此而已：對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息均不同。'
          )

          # 專案交接。
          rep(
              '00_專案交接.md',
              '- 【折光】：Lv10精靈法師／50精神／白色長髮／璀璨金瞳／精靈耳／五官與主身份相同／身份氣息獨立；白髮是因家人中不少人都是白髮、她覺得好看而想試試看的私人巧思。整體可呈現一點近乎神性的氣質，但僅為外觀描述，不代表任何神祇種族、位格或生命層級。',
              '- 【折光】：Lv10精靈法師／50精神／白色長髮／璀璨金瞳／精靈長耳／五官與主身份相同／身份氣息獨立。白髮兼具好看、家人熟悉感與安心感；精靈長耳則因薇薇姐姐與希雅姐都有類似細長耳型，使她自然覺得熟悉親近。近乎神性的感覺僅為外觀氣質，不代表任何神祇種族、位格或生命層級。五官相同僅限五官底子；對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息均不同，不得把同五官寫成整體高度相似或身份強線索。'
          )

          # 第59章知識矩陣：把上一輪過強的相似線索降級。
          rep(
              '04_連續性與索引/04L_角色知識矩陣_第59章增量.md',
              '- 【折光】外觀為白色長髮、璀璨金瞳與精靈耳；五官本身與Franiya主身份相同。看過兩套高品質影像的人可以合理注意到臉部結構高度相似，但這只構成外貌線索，不能直接證明兩個ID／身份屬於同一人。',
              '- 【折光】外觀為白色長髮、璀璨金瞳與精靈長耳；五官底子與Franiya主身份相同，但相同也僅限五官。對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息都不同，因此兩套整體外觀不應自然被判成「高度相似」。只有刻意把高品質正臉並排比較時，才可能注意到局部五官相似。'
          )
          rep(
              '04_連續性與索引/04L_角色知識矩陣_第59章增量.md',
              '- 僅憑相同五官就確認Franiya與【折光】是同一人；兩者的系統身份、種族、髮色、瞳色、耳形與氣息資料仍分離。',
              '- 僅憑相同五官就把Franiya與【折光】連成同一身份；兩者對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息資料均不同。五官相似本身只是弱局部線索，不足以形成身份連結。'
          )

          # 第59章索引。
          rep(
              '04_連續性與索引/06H_章節索引_第59章增量.md',
              '11. Franiya在安全區域切換第二身份【折光】；身份切換鎖1小時啟動，羽毛任務仍6／200。折光外觀固定為白色長髮、璀璨金瞳、精靈耳，五官與主身份相同；白髮來自「家人中不少人都是白髮，所以自己也想試試看」的私人巧思。近乎神性的感覺僅屬氣質描述。',
              '11. Franiya在安全區域切換第二身份【折光】；身份切換鎖1小時啟動，羽毛任務仍6／200。折光外觀固定為白色長髮、璀璨金瞳、精靈長耳，五官與主身份相同。白髮同時來自審美、家人的熟悉感與安心感；精靈長耳則帶有對薇薇姐姐與希雅姐相似長耳的親近聯想。近乎神性的感覺僅屬氣質描述。'
          )
          rep(
              '04_連續性與索引/06H_章節索引_第59章增量.md',
              '16. 公共世界第一次出現【折光】法師PvP素材。因兩身份五官相同，高品質素材可形成「長得很像」的合理線索，但仍沒有足以確認兩個系統身份為同一人的證據。',
              '16. 公共世界第一次出現【折光】法師PvP素材。她與Franiya只有五官底子相同，其餘對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息均不同；因此公開素材不自然形成強烈的「同一人」外貌線索。只有刻意並排比對正臉時，才可能注意到局部五官相似。'
          )

          # Active Queue：撤回必須使用高度相似討論的過強下游要求。
          rep(
              '04_連續性與索引/08_原著事件待處理佇列.md',
              '- 折光RETRO外觀＝白色長髮／璀璨金瞳／精靈耳／與主身份相同五官。第四人若有合法看過Franiya公開素材，可以注意到外貌相似，但不得因此直接知道兩身份同一。',
              '- 折光RETRO外觀＝白色長髮／璀璨金瞳／精靈長耳／與主身份相同五官底子。五官相同僅此而已；對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息均不同。第四人即使合法看過Franiya素材，也只能在刻意比對正臉時把五官相似視為弱局部線索，不能自然形成身份連結。'
          )
          rep(
              '04_連續性與索引/08_原著事件待處理佇列.md',
              '- 由於折光與Franiya五官相同，第114～115章等價媒體／高端玩家分析可合法產生「兩人長得高度相似」的討論；這只能作推測線索，不能越級成身份實錘。',
              '- 第114～115章等價媒體／高端玩家分析不得把「同五官」自動升成兩人整體高度相似。若有人特意取得兩套高品質正臉並排比較，可以提到局部五官相似；但因對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息均不同，這只能是弱線索，也不是媒體線必須出現的主判斷。'
          )

          # 有效性稽核：精修第十節。
          rep(
              '04_連續性與索引/07_有效性與同步稽核.md',
              '- 白髮選擇動機：Franiya家人中有不少白髮，她長期看習慣也覺得好看，因此建立第二身份時帶著「想試試看」的私人巧思選了白髮；不是模仿特定家人。\n- 「帶一點神性的感覺」只作視覺與氣質描述，不代表神祇種族、位格或生命層級。\n- 正文回改點：第49章建立外觀、第50章首次切換／切回、第59章再次切換與旁觀視線。\n- 下游知識邊界：同五官可形成外貌相似線索，但`VISUAL_RESEMBLANCE != IDENTITY_PROOF`；系統身份／種族／氣息仍獨立。\n\n`ZHEGUANG_APPEARANCE_RETRO = PASS`\n`VISUAL_RESEMBLANCE_CLUE = LEGAL`\n`VISUAL_RESEMBLANCE_IS_NOT_IDENTITY_PROOF = TRUE`',
              '- 白髮選擇動機：Franiya家人中有不少白髮，她長期看習慣也覺得好看；白髮同時會讓她聯想到熟悉的家人並帶來安心感，因此建立第二身份時帶著「自己也想試試看」的私人巧思選了白髮；不是模仿特定家人。\n- 精靈長耳選擇動機：薇薇姐姐與希雅姐都有類似精靈的細長耳型，Franiya對這類耳型本來就熟悉、親近且安心；不代表兩位姐姐是《信仰》精靈種。\n- 「帶一點神性的感覺」只作視覺與氣質描述，不代表神祇種族、位格或生命層級。\n- 正文回改點：第49章建立外觀與選擇動機；第50章首次切換／切回；第59章再次切換與旁觀視線。\n- 下游知識邊界修正：五官相同僅限五官底子。對外帳號／角色ID、種族、職業、髮色、瞳色、耳型、氣質與氣息均不同，因此不得把同五官擴張成「整體高度相似」。只有刻意並排比較高品質正臉時才可能形成弱局部相似線索。\n\n`ZHEGUANG_APPEARANCE_RETRO = PASS`\n`SAME_FACIAL_FEATURES_ONLY = TRUE`\n`OVERALL_PRESENTATION_DIFFERENT = TRUE`\n`FACIAL_SIMILARITY = WEAK_LOCAL_CLUE_ONLY`\n`FACIAL_SIMILARITY_ALONE != IDENTITY_LINK`\n`FACIAL_SIMILARITY_ALONE != IDENTITY_PROOF`'
          )

          # 188：上一輪記錄的精修覆蓋。
