name: ch60-closeout-retro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  closeout:
    if: github.event.head_commit.message == 'ops: ch60 closeout trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Ch60 god-spell classification retro and closeout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('小說')
          proj = root / '網遊：重生就是最大的BUG（芙蘭妮雅改寫版）'

          def read(p): return p.read_text(encoding='utf-8')
          def write(p,s): p.write_text(s.rstrip()+"\n", encoding='utf-8')
          def must_replace(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'missing replacement target: {label}')
              return s.replace(old,new)
          def regex_replace(s, pat, repl, label, flags=re.S):
              ns,n = re.subn(pat,repl,s,flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return ns

          # 1) 跨世界家庭總檔
          p = root/'家庭總檔/09_芙蘭妮雅施法載體與魔法造詣補充.md'
          s = read(p)
          old = '''若某種「神咒」的難點只是術式複雜度、元素排列、能量控制、幾何、多層咒式、多線並行與即時重算，這些本身不構成Franiya的學習瓶頸。真正能限制她實際放出的，是可用能量／MP、角色殼吞吐、世界法則與不可偽造的神格、血脈、唯一職業、神權或其他硬權限。\n\n缺少權限時，她不能偽造那把「系統鑰匙」；但若同一效果能由其他合法作用路徑重建，她可以在現有資源內設計替代／近似術式。'''
          new = '''「神咒」在本世界線首先表示**威力／術式層級已達神級的魔法**，不是「神殿專屬術式」的同義詞，也不預設所有神咒都需要同一組資格。\n\n每一個具體神咒的前置條件必須個別判定：有些神咒只需要足夠的能量、角色殼承載與術式控制；有些神咒才會另外要求神格、神權、特定血脈、唯一職業、神器、神殿許可或其他專屬條件。這些要求來自**該神咒本身的機制**，不是因為它被分類為「神咒」就自動成立。\n\n因此，純技術型神咒若難點只是術式複雜度、元素排列、能量控制、幾何、多層咒式、多線並行與即時重算，這些本身不構成Franiya的學習瓶頸；真正先檢查的是當前可用能量／MP、角色殼吞吐與世界規則。若某個具體神咒另有不可偽造權限，她才受那個具體權限限制；若沒有，就不能作者自行替它補上神格／神權等門檻。'''
          s = must_replace(s,old,new,'family09 godspell')
          write(p,s)

          # 2) 專案法師基準：整段重寫
          p = proj/'02_角色設定/09_Franiya法師身份與施法尺度基準.md'
          s = read(p)
          sec = '''## 七、神咒層級與真正瓶頸\n\n本專案將「神咒」理解為**威力／術式層級達到神級的魔法分類**。它不是神殿專屬的同義詞，也不自動附帶固定的神格、神權、血脈或唯一職業要求。\n\n具體神咒的前置條件逐個判定：\n- 純技術／純能量型神咒：可能只要求足夠MP、精神、角色殼吞吐、元素／術式控制與世界規則允許；\n- 權限型神咒：只有當該神咒自身明示或已知機制要求時，才檢查神格、神權、特定血脈、唯一職業、神器、神殿許可或其他身份鑰匙；\n- 不得因名稱叫「神咒」就作者自行補上一整套權限前置。\n\n對Franiya而言，神咒若只是神級規模與高複雜度，她的理解／設計能力本身不是主要瓶頸；實際能不能放，先看角色殼能否供得起神級輸出。若某一具體神咒另有特殊權限，再只對那個神咒核該權限。\n\n固定施工語意：\n- `GOD_SPELL_TIER = DIVINE_GRADE_SPELL_OR_EFFECT_LEVEL`\n- `GOD_SPELL_PERMISSION_REQUIREMENT = SPELL_SPECIFIC`\n- `MAGICAL_COMPLEXITY_ALONE = NOT_FRANIYA_LEARNING_BOTTLENECK`\n- `RESOURCE_LIMIT_OR_EXPLICIT_SPELL_PERMISSION_LOCK = VALID_BOTTLENECK`\n\n缺少某一具體術式明示的權限時，她不能偽造那把系統鑰匙；但這不能外推成「所有神咒都需要這把鑰匙」。\n\n'''
          s = regex_replace(s,r'## 七、神咒級複雜度與真正瓶頸\n.*?(?=## 八、)',sec,'project09 section7')
          write(p,s)

          # 3) 自由構築專檔
          p = proj/'02_角色設定/14_Franiya自由構築_多線施法與術式升階補充.md'
          s = read(p)
          sec = '''## 六、神咒＝神級術式層級；前置條件逐咒判定\n\n「神咒」表示術式／效果已達神級層次。它不等於神殿專屬術式，也不代表所有神咒必須先取得神格、神權、血脈或唯一職業。\n\n判定順序固定為：\n1. 先確認這個具體神咒的結構、輸出與世界規則；\n2. 再確認它自己是否另有特殊前置；\n3. 只有資料明示或合法觀測支持時，才加入神格、神權、特定血脈、唯一職業、神器、神殿許可等要求。\n\n有些神咒完全可以是純術式／純能量型，只要魔力與角色殼承載足夠就能施放；另一些神咒則可能因自身機制帶有特定權限鎖。兩者都屬神咒。\n\n對Franiya來說，如果某個神咒的困難只是神級規模、術式複雜度、元素排列、能量控制、幾何／空間結構、多層咒式、多線並行與即時重算，她可以理解、推演與設計；真正限制實際輸出的是當前MP、精神、角色殼瞬時吞吐與本地世界硬規則。只有該神咒**本身**另帶明確特殊權限時，才把那項權限加入限制。\n\n固定：\n- `GOD_SPELL_TIER = DIVINE_GRADE_SPELL_OR_EFFECT_LEVEL`\n- `GOD_SPELL_PERMISSION_REQUIREMENT = SPELL_SPECIFIC`\n- `MAGICAL_COMPLEXITY_ALONE = NOT_FRANIYA_LEARNING_BOTTLENECK`\n- `RESOURCE_LIMIT_OR_EXPLICIT_SPELL_PERMISSION_LOCK = VALID_BOTTLENECK`\n\n禁止把「神咒」三個字直接翻譯成「必須神格／神權」；也禁止反向宣稱所有神咒都不需要權限。答案只能由具體神咒決定。\n\n'''
          s = regex_replace(s,r'## 六、神咒級複雜度不是Franiya的理解瓶頸\n.*?(?=## 七、)',sec,'project14 section6')
          write(p,s)

          # 4) 新對話總Gate
          p = proj/'07_工作流程/15_新對話完整啟動與章節交易總Gate.md'
          s = read(p)
          old = '- 真正有效限制優先檢查MP、精神、瞬時吞吐、環境、職業／世界硬規則、神格／血脈／神權／唯一權限，而不是把術式複雜度本身誤寫成Franiya的學習瓶頸。'
          new = '''- 「神咒」按神級威力／術式層級理解；不得自動等同神殿專屬，也不得預設固定神格／神權／血脈／唯一職業門檻。每一個神咒的特殊前置逐咒判定。\n- 高階／神咒術式先檢查MP、精神、瞬時吞吐、環境與世界硬規則；只有該具體術式明示或合法資訊確認有特殊權限時，才額外檢查相應神格、神權、血脈、職業、神器、神殿許可等條件。'''
          s = must_replace(s,old,new,'workflow15 godspell')
          write(p,s)

          # 5) 第60章正文
          p = proj/'01_章節/060_第六十章_小火球最好別信.md'
          s = read(p)
          old = '''如果某個所謂神咒必須先有神格、神權、特殊血脈、唯一職業，或者某種只有神殿才能給的許可，那就是權限。\n\n她可以看懂門。\n\n不代表系統會把鑰匙憑空塞給她。\n\n也不代表她需要因為沒有鑰匙，就假裝自己連門的結構都看不懂。'''
          new = '''神咒本身只是另一個層級。\n\n威力、規模或術式完整度真正跨進神級，才是那個稱呼首先代表的東西。\n\n至於要不要神格、神權、特殊血脈、唯一職業，甚至神殿許可，要看是哪一道神咒。\n\n有的要。\n\n有的不用。\n\n如果只是純粹把能量、結構與控制推到神級，那她真正缺的只會是這個角色殼能不能供得起。\n\n如果某一道神咒自己另外鎖了一把鑰匙，那才是那一道術式的權限問題。\n\n她可以看懂門。\n\n但沒有哪條規則說，每一扇叫作「神咒」的門，都一定掛著同一把鎖。'''
          s = must_replace(s,old,new,'chapter60 godspell prose')
          write(p,s)

          # 6) Current State
          p = proj/'04_連續性與索引/01_當前狀態快照.md'
          s = read(p)
          old = '- 高位術式若只難在結構、排列、幾何、能量與並行，對Franiya不是理解瓶頸；真正限制優先看MP、精神、角色殼瞬時吞吐、等級／世界硬規則與神格、神權、血脈、唯一職業等權限。'
          new = '- 神咒按神級威力／術式層級理解；純技術型神咒若資源與角色殼承載足夠，不存在額外學習牆。神格、神權、血脈、唯一職業、神器、神殿許可等只在**具體神咒自身**確有該前置時才成為限制，逐咒判定。'
          s = must_replace(s,old,new,'current state godspell')
          write(p,s)

          # 7) 知識矩陣
          p = proj/'04_連續性與索引/04M_角色知識矩陣_第60章增量.md'
          s = read(p)
          old = '- 若高位術式難點只在結構、排列、幾何、能量與並行，對Franiya不是理解瓶頸；真正硬限制是MP、精神、角色殼吞吐、世界規則與神格／神權／血脈／唯一職業等權限。'
          new = '- 神咒代表神級術式／效果層級；若某神咒只是純技術／純能量型，其神級複雜度對Franiya不是理解牆，真正先受MP、精神、角色殼吞吐與世界規則限制。只有某個具體神咒自身明示需要神格／神權／血脈／唯一職業等前置時，才核那一項權限。'
          s = must_replace(s,old,new,'knowledge godspell')
          old = '- 神格／神權／特殊血脈／唯一職業等權限如何取得。'
          new = '- 哪些未來具體神咒帶有特殊權限前置，以及那些前置如何取得；不能從「神咒」分類本身預設。'
          s = must_replace(s,old,new,'knowledge unknown godspell')
          write(p,s)

          # 8) 章節索引
          p = proj/'04_連續性與索引/06I_章節索引_第60章增量.md'
          s = read(p)
          old = '10. 正文固定：具名系統技能權限≠自由構築等價術式；Franiya可優化8階實效，但不能憑空取得同名UI、神格／神權／血脈／唯一職業等硬權限。'
          new = '10. 正文固定：具名系統技能權限與自由構築等價術式分流；Franiya可優化8階實效。神咒屬神級威力／術式層級，特殊前置逐咒判定，不能把神格／神權／血脈／唯一職業當成所有神咒的共同門檻。'
          s = must_replace(s,old,new,'index godspell')
          write(p,s)

          # 9) POSTWRITE
          p = proj/'08_劇情規劃/197_第六十章POSTWRITE差分_v1.0.md'
          s = read(p)
          old = '13. 高位術式若只難在元素排列／幾何／能量控制／並行，對Franiya本體不是理解瓶頸；真正限制是MP、精神、角色殼吞吐、世界硬規則與神格／血脈／唯一職業／神權等權限。'
          new = '13. 神咒按神級威力／術式層級分類；純技術型神咒的複雜度對Franiya不是理解瓶頸，實際先受MP、精神、角色殼吞吐與世界硬規則限制。神格／神權／血脈／唯一職業等只在某個具體神咒自身明示需要時才構成該術式權限。'
          s = must_replace(s,old,new,'postwrite point13')
          old = '- 未取得神格／神權／血脈／唯一職業等權限內容。'
          new = '- 哪些未來具體神咒具有神格／神權／血脈／唯一職業等特殊前置仍UNKNOWN；不可由「神咒」分類本身推出。'
          s = must_replace(s,old,new,'postwrite unknown')
          s = s.replace('> 狀態：`POSTWRITE_PASS / SYNC_REQUIRED`','> 狀態：`POSTWRITE_PASS / SYNC_COMPLETE_AFTER_CH60_CLOSEOUT_RETRO`')
          s = s.replace('`ASSET_LEDGER_SYNC_REQUIRED = TRUE`','`ASSET_LEDGER_SYNC = PASS`\n`GOD_SPELL_CLASSIFICATION_RETRO = PASS`\n`POSTWRITE_SYNC_COMPLETE = TRUE`')
          write(p,s)

          # 10) Active Queue：正式推進到61
          p = proj/'04_連續性與索引/08_原著事件待處理佇列.md'
          s = read(p)
          old = '''`CURRENT_FORMAL_CHAPTER = 059`\n`NEXT_FORMAL_CHAPTER = 060`\n`EVENT_CONSUMPTION_CURSOR = THROUGH_CH112`\n`SOURCE_READ_CURSOR > EVENT_CONSUMPTION_CURSOR`\n`NEXT_SOURCE_WINDOW = CH113 -> CH115_OR_MORE_IF_NATURAL`\n`CH60_PREWRITE_REQUIRED = TRUE`\n`CH60_BODY_GATE = BLOCKED_UNTIL_PREWRITE`\n\n第59章PREWRITE：`182_第五十九章PREWRITE執行確認_v1.0.md`，已消費。  \n第59章海潮／VOID修正：`185_第59章海潮技能與VOID公開回報修正_v1.0.md`。  \n第60章必須新建PREWRITE。'''
          new = '''`CURRENT_FORMAL_CHAPTER = 060`\n`NEXT_FORMAL_CHAPTER = 061`\n`EVENT_CONSUMPTION_CURSOR = THROUGH_CH115`\n`SOURCE_READ_CURSOR > EVENT_CONSUMPTION_CURSOR`\n`NEXT_SOURCE_WINDOW = CH116_FORWARD`\n`CH116_RAINBOW_BIRD_LEADER = BLOCKED_BY_TRIGGER`\n`CH61_PREWRITE_REQUIRED = TRUE`\n\n第60章PREWRITE：`196_第六十章PREWRITE執行確認_v1.0.md`，已消費。  \n第60章POSTWRITE：`197_第六十章POSTWRITE差分_v1.0.md`，PASS。  \n第60章LIVE來源覆蓋：`05_原著參考/37_SOURCE_LIVE_REBUILD_113-115_CH60.md`。'''
          s = must_replace(s,old,new,'queue progress')
          # section 4 -> completed summary/61 entry
          sec = '''## 四、第60章已完成／第61章來源入口\n\n### CH113\n- status：`FULLY_CONSUMED_FOR_CURRENT_LIVE_BRANCH`。\n- 雨天決行身份、影子師承自述、冰霜舞步推測、匿名擊殺提示修正、海潮實戰、異類法器疊加、元素排列功能均已處理。\n- 沈雲私人排列記憶不移植；Franiya由客觀元素／MP回饋自行推出高效排列。\n\n### CH114\n- status：`FULLY_CONSUMED_FOR_CURRENT_LIVE_BRANCH`。\n- 霓裳／清酒牧歌／左谷風公共與高端分析功能已依本線真實錄影重建；不搬假哭受害鏈，也不搬「女人是軟肋」精確推論。\n\n### CH115\n- status：`FULLY_CONSUMED_FOR_CURRENT_LIVE_BRANCH`。\n- 華夏觀察者公共責任討論與論壇迷因已重建；沈雲專屬外號／主動挑釁／人格品牌策略不移植。\n\n### 第61章入口\n- SOURCE起點116，但彩虹鳥領袖需約100隻彩虹鳥被殺；目前擊殺0，硬觸發`BLOCKED_BY_TRIGGER`。\n- 羽毛7／200；【俯空殺】仍未取得。\n- 116若有不依賴領袖觸發的世界規則／人物事件，可在第61章PREWRITE逐項判定；不得為追游標提前生成領袖。\n- 神咒施工規則：神咒是神級威力／術式層級；特殊權限逐個神咒判定，不得預設所有神咒共享神格／神權／血脈／唯一職業門檻。\n\n'''
          s = regex_replace(s,r'## 四、第60章READY_NOW／最低三章來源責任\n.*?(?=## 五、)',sec,'queue section4')
          s = s.replace('- 當前Franiya彩虹鳥擊殺仍0；羽毛6／200。','- 當前Franiya彩虹鳥擊殺仍0；羽毛7／200。')
          s = regex_replace(s,r'## 七、下一章Gate\n.*\Z','''## 七、下一章Gate\n\n`CURRENT_FORMAL_CHAPTER = 060`\n`NEXT_FORMAL_CHAPTER = 061`\n`STATE_LEDGER_DRIFT_CHECK = PASS_AFTER_CH60_CLOSEOUT`\n`EVENT_CONSUMPTION_CURSOR = THROUGH_CH115`\n`NEXT_SOURCE_WINDOW = CH116_FORWARD`\n`CH116_RAINBOW_BIRD_LEADER = BLOCKED_BY_TRIGGER`\n`RAINBOW_BIRD_KILLS = 0`\n`RAINBOW_FEATHERS = 7/200`\n`DIVE_KILL_SKILL = NOT_ACQUIRED`\n`MIN_ORIGINAL_SOURCE_CHAPTERS_TO_CONSUME = 3`\n`NORMAL_CHAPTER_TARGET_HAN = 9000_TO_14000`\n`FRANIYA_MAGIC_OPTIMIZATION_GATE = REQUIRED_IF_RELEVANT`\n`FRANIYA_PARALLEL_CAST_GATE = REQUIRED_IF_RELEVANT`\n`FRANIYA_FREE_CONSTRUCTION_TIER_GATE = REQUIRED_IF_RELEVANT`\n`GOD_SPELL_PERMISSION_REQUIREMENT = SPELL_SPECIFIC`\n`CH61_BODY_GATE = BLOCKED_UNTIL_NEW_PREWRITE`\n''','queue section7')
          write(p,s)

          # 11) 稽核：將現行頂層狀態推到60，舊59細節保留歷史
          p = proj/'04_連續性與索引/07_有效性與同步稽核.md'
