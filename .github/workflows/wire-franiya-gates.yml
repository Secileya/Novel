name: Wire Franiya Gates

on:
  push:
    paths:
      - '.github/workflows/wire-franiya-gates.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('小說/網遊：重生就是最大的BUG（芙蘭妮雅改寫版）')
          def add_header(path, line):
              s=path.read_text(encoding='utf-8')
              if line not in s:
                  parts=s.split('\n',1)
                  s=parts[0]+'\n\n'+line+'\n'+parts[1]
                  path.write_text(s,encoding='utf-8')
          add_header(root/'07_工作流程/01_原著改寫長期循環.md', '> 2026-09-30完整bootstrap與交易封口以`07_工作流程/15_新對話完整啟動與章節交易總Gate.md`為最新上位補充；若本檔漏掉後加Gate，以15號為準。')
          add_header(root/'07_工作流程/04_施工門禁與Franiya能力Gate補充.md', '> 2026-09-30起PREWRITE另必讀`04_連續性與索引/09_裝備與資產權威總表.md`；完整啟動／封口以`07_工作流程/15_新對話完整啟動與章節交易總Gate.md`收口。')
          add_header(root/'07_工作流程/05_正文事件佇列自動讀取與章節交易.md', '> 2026-09-30完整章節交易另受`07_工作流程/15_新對話完整啟動與章節交易總Gate.md`約束；資產Current Ledger固定為`04_連續性與索引/09_裝備與資產權威總表.md`。')

          p=root/'00_專案交接.md'
          s=p.read_text(encoding='utf-8')
          sec='''\n\n## 2026-09-30｜新對話與資產帳唯一入口\n- 新對話、模型切換、中斷恢復：先讀`07_工作流程/15_新對話完整啟動與章節交易總Gate.md`。\n- 裝備／資產現況：`04_連續性與索引/09_裝備與資產權威總表.md`為獨立Current Ledger；Current State只保留摘要。\n- Franiya出場章：`02/11`完整能力掃描＋`04/09`裝備技能掃描缺一不可。\n- 涉及受傷：`小說/家庭總檔/10_芙蘭妮雅痛覺形成史補充.md`固定生效。\n'''
          if '## 2026-09-30｜新對話與資產帳唯一入口' not in s:
              p.write_text(s.rstrip()+sec+'\n',encoding='utf-8')

          p=root/'04_連續性與索引/01_當前狀態快照.md'
          s=p.read_text(encoding='utf-8')
          marker='## 五、核心裝備／資產\n'
          note='\n> 完整現行資產帳：`04_連續性與索引/09_裝備與資產權威總表.md`。本節只保留閱讀便利摘要；新增／失去／裝備／卸下／CD變更必須同步09號Ledger。\n'
          if note.strip() not in s:
              s=s.replace(marker,marker+note,1)
              p.write_text(s,encoding='utf-8')

          p=root/'04_連續性與索引/08_原著事件待處理佇列.md'
          s=p.read_text(encoding='utf-8')
          sec='''\n\n## 2026-09-30施工入口同步規則\n- 新對話／新模型必讀`07_工作流程/15_新對話完整啟動與章節交易總Gate.md`。\n- PREWRITE前必讀`04_連續性與索引/09_裝備與資產權威總表.md`，核對持有、裝備、身份裝備技能與CD。\n- `HELD != EQUIPPED`；裝備合法附帶技能不得因未使用或原主角私人記憶VOID而被誤判成未取得。\n- 每章最終使用者回報除VOID外，仍必須依14號流程公開全部正式變更。\n'''
          if '## 2026-09-30施工入口同步規則' not in s:
              p.write_text(s.rstrip()+sec+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/wire-franiya-gates.yml
          git diff --check
          git config user.name Secileya
          git config user.email xw4761645@gmail.com
          git add -A
          git commit -m "workflow: 將既有施工入口接入15號總Gate與09號資產Ledger"
          git push origin main
