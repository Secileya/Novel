<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 815" width="1280" height="815"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#14222d"/><stop offset="1" stop-color="#1f2830"/></linearGradient><pattern id="stripes" width="21" height="21" patternUnits="userSpaceOnUse" patternTransform="rotate(32)"><path d="M0 0V21" stroke="#a5a9a2" stroke-opacity=".12" stroke-width="5"/></pattern></defs><rect width="1280" height="815" fill="url(#g)"/><g font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif"><text x="35" y="50" font-size="30" fill="#eaf0f2" font-weight="700">K01｜折返厚殼帶・完整宏觀剖面（作者候選）</text><text x="35" y="80" font-size="17" fill="#aabfc9">W01 與 W02 的大域隔絕：不是一道門，畫面左右亦不按距離比例</text></g><rect x="40" y="141" width="154" height="555" rx="20" fill="#28495c" stroke="#83a5ad" stroke-width="3"/><rect x="1085" y="141" width="156" height="555" rx="20" fill="#34465d" stroke="#8c9fb9" stroke-width="3"/><g font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" text-anchor="middle" fill="#fff4df"><text x="117" y="379" font-size="27" font-weight="700">W01</text><text x="117" y="407" font-size="19">肋海廣域</text><text x="1163" y="379" font-size="27" font-weight="700">W02</text><text x="1163" y="407" font-size="19">折殼曲原</text></g><path d="M202 130 L1076 130 L1076 700 L202 700 Z" fill="#6c645a" opacity=".75"/><path d="M202 130 L1076 130 L1076 700 L202 700 Z" fill="url(#stripes)"/><g stroke="#a7967a" fill="none" stroke-width="19" opacity=".8"><path d="M219 195 Q327 232 382 180 Q520 143 624 222 T1053 196"/><path d="M230 574 Q365 526 479 582 Q634 630 746 576 T1054 614"/><path d="M270 136 Q355 320 340 700"/><path d="M691 135 Q592 377 718 699"/><path d="M961 137 Q893 401 977 697"/></g><g stroke="#ddd2b2" fill="#31424a" stroke-width="3"><path d="M232 251 L449 222 L469 294 L244 326Z"/><path d="M505 265 L747 254 L740 342 L492 357Z"/><path d="M792 235 L1041 275 L1021 343 L805 325Z"/><path d="M245 420 L430 395 L457 481 L251 497Z"/><path d="M491 405 L720 427 L722 511 L489 507Z"/><path d="M791 397 L1039 387 L1030 509 L793 484Z"/></g><g font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" text-anchor="middle" fill="#eaf0f1"><text x="342" y="180" font-size="19">近側接面</text><text x="639" y="180" font-size="19">折殼堆疊腹地</text><text x="930" y="180" font-size="19">遠側反向壁</text><text x="332" y="275" font-size="17">局部工務與住居</text><text x="618" y="315" font-size="17">沉降大空域</text><text x="905" y="301" font-size="17">異年代補殼</text><text x="335" y="459" font-size="17">外緣道路分岔</text><text x="604" y="468" font-size="17">厚殼多次返折</text><text x="915" y="448" font-size="17">彼端接入條件未明</text></g><g fill="none" stroke-linecap="round"><path d="M187 202 Q290 188 392 224 L527 214 Q621 228 742 210 Q891 188 1090 207" stroke="#b6e1c9" stroke-width="7" stroke-dasharray="15 8"/><path d="M191 580 Q318 571 412 585 L527 605 Q644 605 759 572 L874 589" stroke="#9fd0db" stroke-width="6" stroke-dasharray="10 10"/><path d="M874 589 L940 633" stroke="#9fd0db" stroke-opacity=".5" stroke-width="6" stroke-dasharray="4 13"/></g><g font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif"><rect x="465" y="119" width="320" height="34" rx="10" fill="#1c3934"/><text x="625" y="143" fill="#d0f8df" text-anchor="middle" font-size="17">T-A 候選：維護側肋幹線（未核）</text><rect x="438" y="666" width="398" height="32" rx="10" fill="#21404a"/><text x="637" y="689" fill="#d7edf3" text-anchor="middle" font-size="17">T-B／T-C 候選：繞行／斷裂舊道</text><rect x="35" y="732" width="1210" height="56" rx="12" fill="#263743"/><text x="56" y="758" fill="#ebd49a" font-size="17">路況未證：可見的虛線是設計方案，不代表已找到能走通的路；去程與返程須分開核對。</text><text x="56" y="778" fill="#b2c5cc" font-size="14">K01也可有居民、交易、氣候、非人生活及遠離旅行主路的廣大空域；圖內標註均屬作者候選。</text></g></svg>