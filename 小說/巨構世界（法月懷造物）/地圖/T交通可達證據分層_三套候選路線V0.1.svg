<title id="tTitle">T 交通可達證據分層：三組非正史候選路網</title>
<desc id="tDesc">三張互不相連的候選交通示意：K01三線、B案方井至雨檐埠、拱海側域；右下R04 E01尚未證實接通。虛線非證實道路。</desc>
